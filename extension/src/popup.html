<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Save to Capystore</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <span id="capy" class="capy sleeping" aria-hidden="true"></span>
      <div>
        <h1 id="heading">Capystore</h1>
        <p id="detail"></p>
      </div>
    </header>
    <div class="actions">
      <button id="sign-in" type="button">Sign in</button>
      <button id="sign-out" type="button" hidden>Sign out</button>
      <button id="library" type="button">Library</button>
      <button id="options" type="button">Sites</button>
    </div>
    <section id="card" class="card" hidden>
      <h2 id="card-headline">Saving</h2>
      <div class="bar" aria-hidden="true"><span id="card-fill"></span></div>
      <p id="card-label"></p>
      <div class="actions">
        <button id="card-open" type="button" hidden>Open in Studio</button>
        <button id="card-copy" type="button" hidden>Copy link</button>
        <button id="card-retry" type="button" hidden>Retry</button>
        <button id="card-details" type="button" hidden>Details</button>
      </div>
      <p id="card-code" class="code" hidden></p>
    </section>
    <label class="phone"><input id="phone" type="checkbox" checked> Show saves on my iPhone</label>
    <h2>Recent saves</h2>
    <ul id="recent"></ul>
  </main>
  <script src="popup.js"></script>
</body>
</html>
