<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Instagram feed</title>
<style>
  html, body { margin: 0; background: #000; color: #fff; font: 14px/1.2 -apple-system, sans-serif; }
  article { width: 470px; border-bottom: 1px solid #262626; padding: 12px 0 16px; }
  .photo { height: 280px; background: #222; margin: 8px 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
  .row svg { width: 24px; height: 24px; }
</style>
</head>
<body>
<article>
  <a href="/p/AAAAAAAAAAA/">post</a>
  <div class="photo"></div>
  <div class="row"><svg aria-label="Like" viewBox="0 0 24 24"></svg><svg aria-label="Comment" viewBox="0 0 24 24"></svg></div>
</article>
<article>
  <a href="/reel/BBBBBBBBBBB/">reel</a>
  <div class="photo"></div>
  <div class="row"><svg aria-label="Like" viewBox="0 0 24 24"></svg><svg aria-label="Comment" viewBox="0 0 24 24"></svg></div>
</article>
</body>
</html>
