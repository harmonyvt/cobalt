<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Instagram post</title>
<style>
  html, body { margin: 0; background: #000; color: #f5f5f5; font: 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { width: 470px; margin: 0 auto; padding: 16px 0 32px; }
  .head { display: flex; align-items: center; gap: 10px; padding: 8px 4px 10px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; }
  .name { color: #f5f5f5; font-weight: 650; text-decoration: none; }
  .media { height: 320px; background: linear-gradient(160deg, #3a2a22, #141414); }
  .actions { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 6px 8px 4px; }
  .icons { display: flex; align-items: center; gap: 12px; }
  .cell, .save [role="button"] { width: 24px; height: 24px; display: inline-flex; color: #f5f5f5; }
  .count { font-size: 13px; font-weight: 600; }
  .save { display: flex; justify-content: flex-end; }
  .caption { padding: 4px 8px 12px; }
  .comments { padding: 0 8px; display: flex; flex-direction: column; gap: 8px; color: #a8a8a8; }
  .comment { display: flex; gap: 8px; align-items: center; }
  svg { display: block; }
</style>
</head>
<body>
<main id="post">
  <header class="head">
    <span class="avatar"></span>
    <a class="name" href="/capy/">capy</a>
    <a href="/p/POSTPAGE01/"><time datetime="2026-11-18T00:00:00.000Z">3h</time></a>
  </header>
  <div class="media"></div>
  <section class="actions" id="post-actions">
    <div class="icons" id="post-icons">
      <span class="cell"><div role="button" aria-label="Like"><svg aria-label="Like" width="24" height="24" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></span>
      <span class="count">673</span>
      <span class="cell"><div role="button" aria-label="Comment"><svg aria-label="Comment" width="24" height="24" viewBox="0 0 24 24"><path d="M5 6h14v9H8l-3 3V6z" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></span>
      <span class="count">105</span>
      <span class="cell"><div role="button" aria-label="Repost"><svg aria-label="Repost" width="24" height="24" viewBox="0 0 24 24"><path d="M7 7h9l-2-2M17 17H8l2 2" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></span>
      <span class="count">19</span>
      <span class="cell"><div role="button" aria-label="Share"><svg aria-label="Share" width="24" height="24" viewBox="0 0 24 24"><path d="M12 4v10M8 8l4-4 4 4M6 20h12" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></span>
    </div>
    <div class="save" id="post-save">
      <div role="button" aria-label="Save"><div role="button" aria-label="Save"><svg aria-label="Save" width="24" height="24" viewBox="0 0 24 24"><polygon points="20 21 12 13.44 4 21 4 3 20 3 20 21" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></div>
    </div>
  </section>
  <div class="caption"><b>capy</b>one post, open on its own page</div>
  <div class="comments" id="post-comments">
    <div class="comment"><div role="button" aria-label="Like"><svg aria-label="Like" width="12" height="12"></svg></div><span>nice pond</span></div>
    <div class="comment"><div role="button" aria-label="Like"><svg aria-label="Like" width="12" height="12"></svg></div><span>saved</span></div>
    <div class="comment"><div role="button" aria-label="Like"><svg aria-label="Like" width="12" height="12"></svg></div><span>again</span></div>
    <div role="button" aria-label="Comment Options">options</div>
  </div>
</main>
</body>
</html>
