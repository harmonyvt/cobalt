<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>X action bar</title>
<style>
  html, body { margin: 0; background: #000; color: #e7e9ea; }
  body { font: 15px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  article { width: 560px; padding: 16px 16px 12px; box-sizing: border-box; }
  time { color: #71767b; font-size: 15px; }
  .text { margin: 8px 0 4px; font-size: 17px; }
  /* The action bar is one row. The like control is its own role=group, a column,
     which is what the old scanner mounted into (the capy then sat under the heart). */
  #bar {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-start;
    max-width: 425px;
    margin-top: 4px;
    color: #71767b;
  }
  .cell { display: flex; flex-direction: row; align-items: center; flex: 1 1 0; min-width: 0; }
  #like-cell { flex-direction: column; align-items: flex-start; flex: 0 0 auto; }
  .cell button {
    width: 34px; height: 34px; border: 0; padding: 0; margin: 0;
    background: transparent; color: #71767b; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer;
  }
  .cell button:hover { background: rgba(231, 233, 234, 0.1); color: #e7e9ea; }
  .count { font-size: 13px; color: #71767b; margin-left: 2px; }
  #like-cell .count { margin: 0 12px 0 4px; }
</style>
</head>
<body>
<article data-testid="tweet">
  <a href="/capy/status/1111111111111111111"><time datetime="2026-11-17T12:00:00Z">1h</time></a>
  <p class="text">a post in the timeline</p>
  <div id="bar" aria-label="33 replies, 386 reposts, 1.9K likes">
    <div id="like-cell" class="cell" role="group" aria-label="Like">
      <button type="button" data-testid="like" aria-label="Like" title="Like">♥</button>
    </div>
    <span class="count" id="like-count">3.4K</span>
    <div id="reply-cell" class="cell">
      <button type="button" data-testid="reply" aria-label="33 Replies. Reply">💬</button>
      <span class="count">33</span>
    </div>
    <div id="repost-cell" class="cell">
      <button type="button" data-testid="retweet" aria-label="386 Reposts. Repost">↻</button>
      <span class="count">386</span>
    </div>
    <div id="share-cell" class="cell">
      <button type="button" data-testid="share" aria-label="Share">↗</button>
      <span class="count">1.9K</span>
    </div>
    <div id="bookmark-cell" class="cell">
      <button type="button" data-testid="bookmark" aria-label="Bookmark">🔖</button>
    </div>
  </div>
</article>
</body>
</html>
