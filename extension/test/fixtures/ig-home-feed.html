<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Instagram home</title>
<style>
  html, body { margin: 0; background: #000; color: #f5f5f5; font: 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #feed {
    width: 470px; margin: 0 auto; padding: 12px 0 32px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  #stories { display: flex; gap: 14px; width: 100%; padding: 8px 8px 4px; box-sizing: border-box; }
  .story { width: 56px; text-align: center; font-size: 11px; color: #a8a8a8; }
  .ring { width: 56px; height: 56px; border-radius: 50%; border: 2px solid #c13584; box-sizing: border-box; background: #1a1a1a; }
  article { width: 100%; position: relative; }
  .head { display: flex; align-items: center; gap: 10px; padding: 8px 4px 10px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; display: block; }
  .name { color: #f5f5f5; font-weight: 650; text-decoration: none; }
  .when { color: #a8a8a8; text-decoration: none; font-size: 12px; }
  .media { height: 280px; background: #121212; position: relative; }
  .media.photo { background: linear-gradient(160deg, #243044, #1a1a1a 60%); }
  .media.video { background: linear-gradient(#111, #000); }
  .play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 54px; height: 54px; border-radius: 50%; border: 2px solid #fff;
    display: grid; place-items: center; font-size: 22px;
  }
  .frames { display: flex; height: 100%; }
  .frames i { flex: 1; }
  .frames i:first-child { background: #2a241c; }
  .frames i:last-child { background: #1c2830; }
  .dots { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; letter-spacing: 4px; color: #fff; }
  .navbtn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border: 0; border-radius: 50%; background: #fff; color: #000; font-weight: 700;
  }
  .navbtn.prev { left: 8px; }
  .navbtn.next { right: 8px; }
  /* The double-tap heart. It is not a control. Mounting here hides the button. */
  .burst { position: absolute; left: 50%; top: 210px; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; }
  .actions { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 6px 8px 4px; }
  .actions.flat { display: flex; gap: 14px; }
  .icons { display: flex; align-items: center; gap: 12px; }
  .cell, .save [role="button"] { width: 24px; height: 24px; display: inline-flex; color: #f5f5f5; }
  .count { font-size: 13px; font-weight: 600; min-width: 1.5em; }
  .save { display: flex; justify-content: flex-end; }
  .caption { padding: 4px 8px 14px; color: #f5f5f5; }
  .caption b { margin-right: 6px; }
  .comments { display: flex; gap: 8px; padding: 0 8px 12px; color: #a8a8a8; font-size: 12px; }
  .comments [role="button"] { width: 14px; height: 14px; }
  svg { display: block; }
</style>
</head>
<body>
<div id="feed">
  <div id="stories">
    <div class="story" role="button"><div class="ring"></div>your story</div>
    <div class="story" role="button"><div class="ring"></div>capy</div>
    <div class="story" role="button"><div class="ring"></div>harmony</div>
    <div class="story" role="button"><div class="ring"></div>studio</div>
    <div class="story" role="button"><div class="ring"></div>reels</div>
  </div>

  <!-- Image post. Action row is a 2-column grid: icons, then Save. -->
  <article id="photo">
    <header class="head">
      <span class="avatar"></span>
      <div>
        <a class="name" href="/capy/">capy</a><br>
        <a class="when" href="/p/PHOTOCODE11/"><time datetime="2026-11-18T01:00:00.000Z">2h</time></a>
      </div>
    </header>
    <div class="media photo"></div>
    <span class="burst"><svg aria-label="Like" width="128" height="128" viewBox="0 0 48 48"><path d="M34 6c-4 0-7 2-10 6-3-4-6-6-10-6C6 6 0 12 0 20c0 11 14 22 24 26 10-4 24-15 24-26 0-8-6-14-14-14z" fill="#fff"/></svg></span>
    <section class="actions" id="photo-actions">
      <div class="icons" id="photo-icons">
        <span class="cell"><div role="button" aria-label="Like"><svg aria-label="Like" width="24" height="24" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></span>
        <span class="count">1,204</span>
        <span class="cell"><div role="button" aria-label="Comment"><svg aria-label="Comment" width="24" height="24" viewBox="0 0 24 24"><path d="M5 6h14v9H8l-3 3V6z" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></span>
        <span class="count">88</span>
        <span class="cell"><div role="button" aria-label="Share"><svg aria-label="Share" width="24" height="24" viewBox="0 0 24 24"><path d="M12 4v10M8 8l4-4 4 4M6 20h12" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></span>
      </div>
      <div class="save" id="photo-save">
        <div role="button" aria-label="Save"><div role="button" aria-label="Save"><svg aria-label="Save" width="24" height="24" viewBox="0 0 24 24"><polygon points="20 21 12 13.44 4 21 4 3 20 3 20 21" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></div>
      </div>
    </section>
    <div class="caption"><b>capy</b>afternoon at the pond</div>
    <div class="comments">
      <div role="button" aria-label="Like"><svg aria-label="Like" width="12" height="12" viewBox="0 0 24 24"></svg></div>
      <div role="button" aria-label="Like"><svg aria-label="Like" width="12" height="12" viewBox="0 0 24 24"></svg></div>
      <div role="button" aria-label="Comment Options">···</div>
    </div>
  </article>

  <!-- Video in the feed. The audio disc is the first link and is not the post. -->
  <article id="video">
    <a href="/reels/audio/1789012345/" hidden>audio</a>
    <header class="head">
      <span class="avatar"></span>
      <div>
        <a class="name" href="/harmony/">harmony</a><br>
        <a class="when" href="/reel/FEEDVID1111/"><time datetime="2026-11-17T22:00:00.000Z">5h</time></a>
      </div>
    </header>
    <div class="media video"><div class="play">▶</div></div>
    <section class="actions flat" id="video-actions">
      <span class="cell"><div role="button" aria-label="Like"><svg aria-label="Like" width="24" height="24" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></span>
      <span class="cell"><div role="button" aria-label="Comment"><svg aria-label="Comment" width="24" height="24" viewBox="0 0 24 24"><path d="M5 6h14v9H8l-3 3V6z" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></span>
      <span class="cell"><div role="button" aria-label="Repost"><svg aria-label="Repost" width="24" height="24" viewBox="0 0 24 24"><path d="M7 7h9l-2-2M17 17H8l2 2" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></span>
      <span class="cell"><button type="button" aria-label="Share Post"><svg aria-label="Share Post" width="24" height="24" viewBox="0 0 24 24"><path d="M12 4v10M8 8l4-4 4 4M6 20h12" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></span>
      <span class="cell" id="video-save"><div role="button" aria-label="Save"><svg aria-label="Save" width="24" height="24" viewBox="0 0 24 24"><polygon points="20 21 12 13.44 4 21 4 3 20 3 20 21" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></span>
    </section>
    <div class="caption"><b>harmony</b>a reel, posted in the feed</div>
    <a href="/p/FEEDVID1111/c/18130549336575775/">view comment</a>
  </article>

  <!-- Carousel. Next/Back are not action-row buttons. -->
  <article id="carousel">
    <header class="head">
      <span class="avatar"></span>
      <div>
        <a class="name" href="/studio/">studio</a><br>
        <a class="when" href="/p/CAROUSEL111/"><time datetime="2026-11-16T12:00:00.000Z">1d</time></a>
      </div>
    </header>
    <div class="media">
      <div class="frames"><i></i><i></i></div>
      <div class="dots">● ○</div>
      <button class="navbtn prev" type="button" aria-label="Go back">‹</button>
      <button class="navbtn next" type="button" aria-label="Next">›</button>
    </div>
    <section class="actions" id="carousel-actions">
      <div class="icons" id="carousel-icons">
        <span class="cell"><div role="button" aria-label="Like"><svg aria-label="Like" width="24" height="24" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></span>
        <span class="count">640</span>
        <span class="cell"><div role="button" aria-label="Comment"><svg aria-label="Comment" width="24" height="24" viewBox="0 0 24 24"><path d="M5 6h14v9H8l-3 3V6z" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></span>
        <span class="count">12</span>
        <span class="cell"><div role="button" aria-label="Share"><svg aria-label="Share" width="24" height="24" viewBox="0 0 24 24"><path d="M12 4v10M8 8l4-4 4 4M6 20h12" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></span>
      </div>
      <div class="save" id="carousel-save">
        <div role="button" aria-label="Save"><svg aria-label="Save" width="24" height="24" viewBox="0 0 24 24"><polygon points="20 21 12 13.44 4 21 4 3 20 3 20 21" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>
      </div>
    </section>
    <div class="caption"><b>studio</b>two frames</div>
    <div class="comments">
      <div role="button" aria-label="Like"><svg aria-label="Like" width="12" height="12"></svg></div>
      <div role="button" aria-label="Like"><svg aria-label="Like" width="12" height="12"></svg></div>
      <div role="button" aria-label="Like"><svg aria-label="Like" width="12" height="12"></svg></div>
      <div role="button" aria-label="Comment Options">···</div>
    </div>
  </article>
</div>
</body>
</html>
