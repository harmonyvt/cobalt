<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobalt — Collections & Share Link Redesign (4 Variations)</title>
<style>
:root {
  --ui-mono: var(--font-mono, "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace);
  --ui-sans: var(--font-sans, -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif);
  --shell-card: var(--card, rgba(22, 22, 28, 0.92));
  --shell-fg: var(--foreground, #f2f2f5);
  --shell-muted: var(--muted-foreground, #92929e);
  --shell-border: var(--border, rgba(255, 255, 255, 0.12));
  --shell-radius: var(--radius, 14px);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: var(--ui-sans);
  color: var(--shell-fg);
  -webkit-font-smoothing: antialiased;
  line-height: 1.38;
}
button {
  font: inherit;
  color: inherit;
  border: 0;
  background: transparent;
  cursor: pointer;
  padding: 0;
}
button:focus-visible {
  outline: 2px solid #2f8af9;
  outline-offset: 2px;
}
svg { display: block; flex: none; }
.mono { font-family: var(--ui-mono); font-variant-numeric: tabular-nums; }

.wrap {
  container-type: inline-size;
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ====== SHOWCASE TOOLBAR ====== */
.showcase-bar {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 9px 11px;
  background: var(--shell-card);
  border: 1px solid var(--shell-border);
  border-radius: var(--shell-radius);
}
.bar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 7px;
}
.brand-gem {
  width: 9px;
  height: 9px;
  border-radius: 3px;
  transform: rotate(45deg);
  background: linear-gradient(135deg, #f0b44c, #2f8af9 55%, #b69cff);
  box-shadow: 0 0 10px rgba(47, 138, 249, 0.55);
}
.brand-name {
  font-family: var(--ui-mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.brand-tag {
  font-family: var(--ui-mono);
  font-size: 9.5px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 99px;
  background: rgba(240, 180, 76, 0.16);
  border: 1px solid rgba(240, 180, 76, 0.36);
  color: #f0b44c;
}

.seg-group {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px;
  padding: 2.5px;
  border-radius: 10px;
  background: rgba(128, 128, 145, 0.13);
  border: 1px solid var(--shell-border);
}
.seg-btn {
  font-family: var(--ui-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 4.5px 7.5px;
  border-radius: 7.5px;
  color: var(--shell-muted);
  transition: background 0.14s, color 0.14s;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.seg-btn:hover { color: var(--shell-fg); }
.seg-btn.active {
  background: var(--shell-fg);
  color: var(--background, #09090b);
}
.seg-btn.cmp-active {
  background: linear-gradient(135deg, #f0b44c, #34d399);
  color: #09090b;
}

/* ====== DIRECTION BRIEF BANNER ====== */
.brief-banner {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 9px 12px;
  border-radius: 12px;
  background: var(--shell-card);
  border: 1px solid var(--shell-border);
}
.brief-main { flex: 1; min-width: 240px; }
.brief-title {
  margin: 0 0 2px;
  font-family: var(--ui-mono);
  font-size: 12.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}
.rec-pill {
  font-size: 9px;
  font-weight: 700;
  padding: 1.5px 6px;
  border-radius: 99px;
  background: rgba(52, 211, 153, 0.18);
  border: 1px solid rgba(52, 211, 153, 0.45);
  color: #34d399;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.brief-desc {
  margin: 0;
  font-size: 11px;
  color: var(--shell-muted);
}
.brief-chips {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
}
.fix-chip {
  font-family: var(--ui-mono);
  font-size: 9.5px;
  padding: 3px 7px;
  border-radius: 99px;
  background: rgba(128, 128, 145, 0.14);
  border: 1px solid var(--shell-border);
  color: var(--shell-fg);
  white-space: nowrap;
}

/* ====== STAGE ====== */
.stage-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
.stage-grid.side-by-side-portrait {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: start;
}
@container (max-width: 640px) {
  .stage-grid.side-by-side-portrait {
    grid-template-columns: 1fr;
  }
}

.screen-block {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}
.screen-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-family: var(--ui-mono);
  font-size: 10px;
  color: var(--shell-muted);
  padding: 0 2px;
}
.screen-meta strong { color: var(--shell-fg); }

/* ====== COBALT DESIGN TOKENS (LIGHT + DARK, AUTHENTIC Tokens.swift) ====== */
.duo-device {
  --bg: #000000;
  --surface: #18181b;
  --surface-2: #1f1f24;
  --elevated: #28282e;
  --text: #e8e8ec;
  --on-text: #09090b;
  --caption: #8f8f99;
  --border: rgba(255, 255, 255, 0.12);
  --hairline: rgba(255, 255, 255, 0.075);
  --glass-bg: rgba(28, 28, 34, 0.72);
  --glass-hi: rgba(255, 255, 255, 0.14);
  --glass-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  --amber: #f0b44c;
  --amber-bg: rgba(240, 180, 76, 0.16);
  --amber-bd: rgba(240, 180, 76, 0.36);
  --set: #b69cff;
  --set-bg: rgba(182, 156, 255, 0.16);
  --set-bd: rgba(182, 156, 255, 0.38);
  --blue: #2f8af9;
  --blue-bg: rgba(47, 138, 249, 0.16);
  --blue-bd: rgba(47, 138, 249, 0.38);
  --emerald: #34d399;
  --emerald-bg: rgba(52, 211, 153, 0.16);
  --emerald-bd: rgba(52, 211, 153, 0.42);
  --loud: #f87171;
  --loud-bg: rgba(248, 113, 113, 0.15);
  --quiet: #38bdf8;
  --quiet-bg: rgba(56, 189, 248, 0.15);
  --warn: #fbbf24;
  --warn-bg: rgba(251, 191, 36, 0.16);
  --red: #ff5c6c;
  --red-bg: rgba(255, 92, 108, 0.16);
  --red-bd: rgba(255, 92, 108, 0.34);
  --rail-bg: #000000;
  --rail-pill: rgba(255, 255, 255, 0.09);
  --rail-pill-bd: rgba(255, 255, 255, 0.14);
  --rail-active: rgba(255, 255, 255, 0.22);
  --bezel: #24242a;

  position: relative;
  background: var(--bg);
  color: var(--text);
  border: 2px solid var(--bezel);
  border-radius: 26px;
  overflow: hidden;
  font-family: var(--ui-mono);
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.38);
  transition: background 0.2s ease, color 0.2s ease;
}

.duo-device.theme-light {
  --bg: #ffffff;
  --surface: #f4f4f6;
  --surface-2: #ececf0;
  --elevated: #e4e4e9;
  --text: #09090b;
  --on-text: #ffffff;
  --caption: #676771;
  --border: rgba(0, 0, 0, 0.11);
  --hairline: rgba(0, 0, 0, 0.07);
  --glass-bg: rgba(248, 248, 251, 0.78);
  --glass-hi: rgba(255, 255, 255, 0.85);
  --glass-shadow: 0 8px 22px rgba(0, 0, 0, 0.10);
  --amber: #8a5a00;
  --amber-bg: #fbefd6;
  --amber-bd: rgba(138, 90, 0, 0.28);
  --set: #5b3fb0;
  --set-bg: #eee7fb;
  --set-bd: rgba(91, 63, 176, 0.3);
  --blue: #196bd4;
  --blue-bg: rgba(25, 107, 212, 0.12);
  --blue-bd: rgba(25, 107, 212, 0.3);
  --emerald: #0d8a5c;
  --emerald-bg: rgba(13, 138, 92, 0.12);
  --emerald-bd: rgba(13, 138, 92, 0.34);
  --loud: #c92a38;
  --loud-bg: rgba(201, 42, 56, 0.11);
  --quiet: #0273a8;
  --quiet-bg: rgba(2, 115, 168, 0.11);
  --warn: #a16207;
  --warn-bg: rgba(161, 98, 7, 0.13);
  --red: #c4142a;
  --red-bg: rgba(196, 20, 42, 0.11);
  --red-bd: rgba(196, 20, 42, 0.28);
  --rail-bg: #ffffff;
  --rail-pill: rgba(0, 0, 0, 0.045);
  --rail-pill-bd: rgba(0, 0, 0, 0.10);
  --rail-active: rgba(0, 0, 0, 0.10);
  --bezel: #d4d4dc;
}

.duo-shell {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 48px;
  min-height: 448px;
}
.duo-device.pose-portrait .duo-shell {
  grid-template-columns: minmax(0, 1fr) 46px;
  min-height: 472px;
}
@container (max-width: 440px) {
  .duo-shell { grid-template-columns: minmax(0, 1fr) 40px; }
}

.duo-content {
  min-width: 0;
  padding: 12px 10px 12px 13px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  position: relative;
}

/* ====== IPHONE DUO VERTICAL CONTROLS RAIL (IMG_0661 & IMG_0648) ====== */
.duo-rail {
  background: var(--rail-bg);
  border-left: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 10px 4px 11px;
  user-select: none;
}
.rail-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.rail-status {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-family: var(--ui-sans);
  font-size: 9.5px;
  font-weight: 700;
  color: var(--text);
}
.rail-ring {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--text);
  border-bottom-color: var(--border);
  display: grid;
  place-items: center;
  font-size: 8px;
  font-weight: 800;
}
.rail-circle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--rail-pill);
  border: 1px solid var(--rail-pill-bd);
  display: grid;
  place-items: center;
  color: var(--text);
  transition: transform 0.12s, background 0.15s;
}
.rail-circle:hover { background: var(--rail-active); }
.rail-circle:active { transform: scale(0.92); }
.rail-circle.on {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}
.rail-capsule {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 6px 4px;
  border-radius: 99px;
  background: var(--rail-pill);
  border: 1px solid var(--rail-pill-bd);
  color: var(--text);
}
.rail-capsule button {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--text);
  transition: background 0.14s;
}
.rail-capsule button:hover { background: var(--rail-active); }
.rail-capsule button.active-tab {
  background: var(--rail-active);
}
.rail-capsule button.sel-on {
  background: var(--blue);
  color: #fff;
}

/* ====== SYNTHETIC REALISTIC MEDIA ARTWORK ====== */
.art {
  position: relative;
  overflow: hidden;
  display: block;
}
.art-a { background: linear-gradient(155deg, #62564e 0%, #312c30 55%, #17161b 100%); }
.art-b { background: linear-gradient(150deg, #9c8269 0%, #5c493b 54%, #251d18 100%); }
.art-c { background: linear-gradient(145deg, #4b5d78 0%, #263147 52%, #131824 100%); }
.art-d { background: radial-gradient(circle at 60% 35%, #695e45 0%, #24252d 50%, #0b0b0e 100%); }
.art-e { background: linear-gradient(160deg, #3c6259 0%, #1d3531 55%, #0d1917 100%); }
.art-f { background: linear-gradient(150deg, #6b4c7a 0%, #342442 54%, #16101f 100%); }
.art-g { background: linear-gradient(155deg, #8a4a55 0%, #44212a 55%, #190d11 100%); }
.art-h { background: linear-gradient(145deg, #4f6f8f 0%, #2a3e54 55%, #131c28 100%); }
.art-i { background: linear-gradient(160deg, #7d6846 0%, #3e3424 55%, #1a1610 100%); }

/* Subtle visual texture / subject silhouette inside thumbs */
.art::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.16), transparent 56%);
  pointer-events: none;
}
.art-cap {
  position: absolute;
  top: 5px;
  left: 5px;
  right: 5px;
  font-family: var(--ui-sans);
  font-size: 7px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.9);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
  line-height: 1.15;
  text-align: center;
  pointer-events: none;
}
.play-pip {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.56);
  backdrop-filter: blur(6px);
  display: grid;
  place-items: center;
  color: #fff;
}
.play-pip.sm { width: 18px; height: 18px; }
.play-pip.lg { width: 34px; height: 34px; }
.dur-pip {
  position: absolute;
  bottom: 4px;
  right: 4px;
  padding: 1px 4px;
  border-radius: 5px;
  font-size: 8px;
  font-weight: 600;
  background: rgba(0, 0, 0, 0.68);
  color: #f4f4f6;
}
.count-pip {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.54);
  display: grid;
  place-items: center;
  font-size: 10.5px;
  font-weight: 700;
  color: #fff;
}

/* ====== ADAPTIVE COVER ENGINE (1 / 2 / 3 / 4+ items — ZERO EMPTY BOXES!) ====== */
.acover {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  background: var(--elevated);
  display: grid;
  gap: 2px;
  flex: none;
}
.acover.n1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.acover.n2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
.acover.n3 { grid-template-columns: 1.35fr 1fr; grid-template-rows: 1fr 1fr; }
.acover.n3 > :first-child { grid-row: 1 / 3; }
.acover.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.acover .acell {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow: hidden;
}

/* ====== SHARED TYPOGRAPHY & CHIPS ====== */
.nav-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.nav-title {
  font-family: var(--ui-sans);
  font-size: 16px;
  font-weight: 750;
  letter-spacing: -0.025em;
  color: var(--text);
  margin: 0;
}
.sec-lbl {
  font-size: 10px;
  color: var(--caption);
  letter-spacing: 0.01em;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.chip-row {
  display: flex;
  align-items: center;
  gap: 5px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 1px;
}
.chip-row::-webkit-scrollbar { display: none; }

.set-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10.5px;
  font-weight: 600;
  padding: 4.5px 9px;
  border-radius: 99px;
  background: var(--elevated);
  color: var(--set);
  white-space: nowrap;
  transition: all 0.14s;
  flex: none;
}
.set-chip.all-chip { color: var(--text); }
.set-chip.on {
  background: var(--set);
  color: #fff;
}
.set-chip.all-chip.on {
  background: var(--text);
  color: var(--on-text);
}
.set-chip.dashed {
  background: transparent;
  color: var(--caption);
  border: 1.2px dashed var(--border);
}
.set-chip.dashed:hover {
  border-color: var(--text);
  color: var(--text);
}

.set-action-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 5px 9px;
  border-radius: 11px;
  background: var(--set-bg);
  border: 1px solid var(--set-bd);
  color: var(--set);
  font-size: 10px;
}
.set-action-btns {
  display: flex;
  align-items: center;
  gap: 4px;
}
.mini-pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 9.5px;
  font-weight: 650;
  padding: 3.5px 7.5px;
  border-radius: 99px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  transition: all 0.14s;
  white-space: nowrap;
}
.mini-pill-btn:hover { border-color: var(--text); }
.mini-pill-btn.set-tint {
  background: var(--set);
  border-color: transparent;
  color: #fff;
}
.mini-pill-btn.em-tint {
  background: var(--emerald);
  border-color: transparent;
  color: #041d14;
}
.mini-pill-btn.amber-tint {
  background: var(--amber-bg);
  border-color: var(--amber-bd);
  color: var(--amber);
}
.mini-pill-btn.red-tint {
  background: var(--red-bg);
  border-color: var(--red-bd);
  color: var(--red);
}

.icon-copy-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--text);
  color: var(--on-text);
  display: grid;
  place-items: center;
  flex: none;
  transition: transform 0.12s, background 0.15s;
}
.icon-copy-btn:active { transform: scale(0.9); }
.icon-copy-btn.copied {
  background: var(--emerald);
  color: #041e14;
}
.icon-soft-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--elevated);
  border: 1px solid var(--border);
  color: var(--text);
  display: grid;
  place-items: center;
  flex: none;
  transition: all 0.14s;
}
.icon-soft-btn.blue { background: var(--blue-bg); border-color: var(--blue-bd); color: var(--blue); }
.icon-soft-btn.em { background: var(--emerald-bg); border-color: var(--emerald-bd); color: var(--emerald); }
.icon-soft-btn.red { background: var(--red-bg); border-color: var(--red-bd); color: var(--red); }

.select-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 6px 9px;
  border-radius: 11px;
  background: var(--blue-bg);
  border: 1px solid var(--blue-bd);
  color: var(--blue);
  font-size: 10px;
  font-weight: 600;
}

/* ====== VARIATION A: ADAPTIVE BENTO & UNIFIED SHARE DECK ====== */
.va-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.duo-device.pose-portrait .va-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
@container (max-width: 580px) {
  .va-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.va-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 7px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--hairline);
  text-align: left;
  transition: transform 0.12s, border-color 0.15s;
}
.va-card:hover { border-color: var(--border); }
.va-card.selected {
  border-color: var(--blue);
  box-shadow: 0 0 0 1.5px var(--blue);
}
.va-card .acover {
  width: 100%;
  aspect-ratio: 16 / 10;
  border-radius: 9px;
}
.va-card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  min-width: 0;
}
.va-card-meta { min-width: 0; }
.va-card-name {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10.5px;
  font-weight: 650;
  color: var(--amber);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.va-card-sub {
  font-size: 9.5px;
  color: var(--caption);
  display: flex;
  align-items: center;
  gap: 4px;
}
.va-new-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

let toastTimer = null;
function showToast(msg, tone = "neutral") {
  const el = document.getElementById("toastEl");
  el.textContent = msg;
  el.className = "toast-float show" + (tone === "ok" ? " ok" : tone === "err" ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2300);
}

function shakeEl(el) {
  if (!el) return;
  el.classList.remove("shaking");
  void el.offsetWidth;
  el.classList.add("shaking");
}

function flashCopy(id, msg, tone = "ok") {
  state.copiedId = id;
  showToast(msg, tone);
  render();
  setTimeout(() => {
    if (state.copiedId === id) {
      state.copiedId = null;
      render();
    }
  }, 1500);
}

// ====== AUDIO GATE LOGIC (mirrors AudioShareGate) ======
function getGate() {
  const audible = state.files.filter(f => f.kind === "video");
  const leveled = audible.filter(f => f.audio === "ok");
  const working = audible.filter(f => f.audio === "work");
  const remaining = audible.filter(f => f.audio !== "ok" && f.audio !== "work");
  const unlocked = audible.length > 0 && leveled.length === audible.length;
  return { audible, leveled, working, remaining, unlocked };
}

function startBulkLevel(singleId = null) {
  const targets = singleId
    ? state.files.filter(f => f.id === singleId && f.audio !== "ok" && f.audio !== "work")
    : state.files.filter(f => f.kind === "video" && f.audio !== "ok" && f.audio !== "work");
  if (!targets.length) return;
  targets.forEach(f => { f.audio = "work"; });
  showToast(`Leveling ${targets.length} video${targets.length > 1 ? "s" : ""} to -14 LUFS…`);
  render();
  targets.forEach((f, idx) => {
    setTimeout(() => {
      f.audio = "ok";
      f.lufs = -14.0;
      const g = getGate();
      if (g.unlocked) {
        state.useNormalAudio = true;
        showToast("All videos leveled · ?audio=normal unlocked!", "ok");
      }
      render();
    }, 650 + idx * 550);
  });
}

function resetAudioDemo() {
  state.files = INITIAL_LINK_FILES.map(f => ({ ...f }));
  state.useNormalAudio = false;
  showToast("Reset audio telemetry (2 videos un-leveled)");
  render();
}

// ====== ADAPTIVE COVER HTML (1, 2, 3, or 4+ — ZERO EMPTY BOXES) ======
function renderAdaptiveCover(thumbs, extra = 0, showPlay = true) {
  const count = Math.min(4, Math.max(1, thumbs.length));
  const shown = thumbs.slice(0, count);
  const cells = shown.map((t, idx) => {
    const isLastOverflow = idx === 3 && extra > 0;
    return `
      <div class="acell art ${t.cls}">
        ${t.cap && count === 1 ? `<div class="art-cap">${t.cap}</div>` : ""}
        ${showPlay && !isLastOverflow ? `<div class="play-pip ${count > 1 ? "sm" : ""}">${IC.play}</div>` : ""}
        ${t.dur && count === 1 ? `<span class="dur-pip">${t.dur}</span>` : ""}
        ${isLastOverflow ? `<div class="count-pip">+${extra}</div>` : ""}
      </div>`;
  }).join("");
  return `<div class="acover n${count}">${cells}</div>`;
}

function renderFileRows(dense = false) {
  return state.files.map((f, i) => {
    let badge = "";
    if (!state.linkEditing) {
      if (f.audio === "ok") {
        badge = `<span class="lufs-pill ok">${IC.check} ${f.lufs.toFixed(1)}</span>`;
      } else if (f.audio === "work") {
        badge = `<span class="lufs-pill work">${IC.wave} leveling…</span>`;
      } else if (f.audio === "loud") {
        badge = `<button class="lufs-pill loud" data-level-one="${f.id}" title="Tap to level">${f.lufs.toFixed(1)} ${IC.wave}</button>`;
      } else if (f.audio === "quiet") {
        badge = `<button class="lufs-pill quiet" data-level-one="${f.id}" title="Tap to level">${f.lufs.toFixed(1)} ${IC.wave}</button>`;
      } else {
        badge = `<span class="lufs-pill img">image</span>`;
      }
    }
    return `
      <div class="file-row" style="${dense ? "padding:4.5px 7px;" : ""}">
        ${state.linkEditing
          ? `<button style="color:var(--red);" data-remove-file="${f.id}" title="Remove">${IC.minus}</button>`
          : `<span class="file-num">${i + 1}</span>`}
        <div class="file-thumb art ${f.cls}" style="${dense ? "width:30px;height:30px;" : ""}">
          ${f.kind === "video" ? `<div class="play-pip sm">${IC.play}</div>` : ""}
        </div>
        <div class="file-meta">
          <div class="file-name">${f.title}</div>
          <div class="file-sub">${f.kind}${f.dur ? " · " + f.dur : ""}</div>
        </div>
        ${state.linkEditing ? `<span style="color:var(--caption);">${IC.grip}</span>` : `${badge}<span style="color:var(--caption);">${IC.chevRight}</span>`}
      </div>`;
  }).join("");
}

function renderHeroGrid(withBadges = true) {
  return `
    <div class="hero-mosaic">
      ${state.files.slice(0, 4).map(f => {
        const bCls = f.audio === "ok" ? "ok" : f.audio === "loud" ? "loud" : f.audio === "quiet" ? "quiet" : f.audio === "work" ? "work" : "";
        const bTxt = f.audio === "ok" ? "-14.0" : f.audio === "work" ? "…" : f.lufs ? f.lufs.toFixed(1) : "img";
        return `
          <div class="hero-cell art ${f.cls}">
            ${f.cap ? `<div class="art-cap">${f.cap}</div>` : ""}
            ${f.kind === "video" ? `<div class="play-pip">${IC.play}</div>` : ""}
            ${withBadges ? `<span class="hero-lufs ${bCls}">${bTxt}</span>` : ""}
          </div>`;
      }).join("")}
    </div>`;
}

function renderDiscordCard() {
  if (!state.showDiscord) return "";
  return `
    <div class="discord-box">
      <div style="display:flex;align-items:center;justify-content:space-between;font-size:9.5px;">
        <strong style="color:var(--text);">how discord shows it</strong>

function renderCollectionPills() {
  const names = ["Lia Share 40", "Discord Drops", "Best Of"];
  return names.map(n => {
    const on = state.linkColls.has(n);
    return `<button class="coll-tag ${on ? "" : "off"}" data-toggle-lcoll="${n}">${IC.folder} ${n}</button>`;
  }).join("");
}

function renderAudioDistBar(g) {
  const total = Math.max(1, g.audible.length);
  const okW = (g.leveled.length / total) * 100;
  const workW = (g.working.length / total) * 100;
  const loudW = (g.audible.filter(f => f.audio === "loud").length / total) * 100;
  const quietW = (g.audible.filter(f => f.audio === "quiet").length / total) * 100;
  return `
    <div class="dist-track">
      ${okW ? `<span class="ds-ok" style="width:${okW}%"></span>` : ""}
      ${workW ? `<span class="ds-work" style="width:${workW}%"></span>` : ""}
      ${loudW ? `<span class="ds-loud" style="width:${loudW}%"></span>` : ""}
      ${quietW ? `<span class="ds-quiet" style="width:${quietW}%"></span>` : ""}
    </div>`;
}

          <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
            <button class="mini-pill-btn ${state.linkEditing ? "em-tint" : ""}" data-toggle-edit>${IC.edit} ${state.linkEditing ? "editing" : "edit order"}</button>
            <button class="mini-pill-btn" data-toggle-priv>${state.linkPrivate ? IC.globe + " make public" : IC.lock + " make private"}</button>
            <button class="mini-pill-btn red-tint" style="margin-left:auto;" data-toast="Confirm: Revoke this share link?">${IC.revoke} revoke</button>
          </div>

          ${renderEditBar()}
          <div class="badge-row">${renderCollectionPills()}</div>
          <div class="sec-lbl"><span>files · in order</span><span>${state.files.length} of 10</span></div>
          <div class="file-list">${renderFileRows()}</div>
        </div>
      </div>`;
  } else if (v === "C") {
    // VARIATION C: Studio Command Inspector + Live LUFS Ruler + High-Density Queue
    const dots = g.audible.map(f => {
      const pct = Math.max(5, Math.min(95, ((f.lufs + 32) / 32) * 100));
      const bg = f.audio === "ok" ? "var(--emerald)" : f.audio === "loud" ? "var(--loud)" : f.audio === "quiet" ? "var(--quiet)" : "var(--warn)";
      return `<span class="vc-ruler-dot" style="left:${pct}%;background:${bg};"></span>`;
    }).join("");

    body = `
      <div class="nav-top">
        <div style="display:flex;align-items:center;gap:7px;min-width:0;">
          <h2 class="nav-title">${state.linkTitle}</h2>
          <span class="vis-badge ${state.linkPrivate ? "is-priv" : ""}">${state.linkPrivate ? IC.lock + " private" : IC.globe + " public"}</span>
        </div>
        <span style="font-size:9.5px;color:var(--caption);">today 23:50</span>
      </div>

      <div class="url-pill" style="padding:6px 8px;">
        <span class="url-path" style="color:var(--text);">${u.base}<span class="url-q">${u.suffix}</span></span>
        <button class="mini-pill-btn ${normalOn ? "em-tint" : ""}" data-set-normal="${normalOn ? "0" : "1"}">${g.unlocked ? IC.wave : IC.lock} ?audio=normal</button>
        <button class="mini-pill-btn ${isCopied ? "em-tint" : ""}" data-copy-detail>${isCopied ? IC.check : IC.copy} ${isCopied ? "copied" : "copy"}</button>
        <button class="icon-soft-btn blue" style="width:24px;height:24px;" data-toast="Share ${u.full}">${IC.share}</button>
      </div>

      <div class="vc-cmd-row">
        <button class="mini-pill-btn ${state.linkEditing ? "em-tint" : ""}" data-toggle-edit>${IC.edit} edit</button>
        <button class="mini-pill-btn" data-toggle-priv>${state.linkPrivate ? IC.globe + " public" : IC.lock + " private"}</button>
        <button class="mini-pill-btn" data-toggle-discord>${IC.eye} discord</button>
        ${renderCollectionPills()}
        <button class="mini-pill-btn red-tint" style="margin-left:auto;" data-toast="Confirm: Revoke share link?">${IC.revoke} revoke</button>
      </div>

      ${renderEditBar()}
      ${renderDiscordCard()}

      <div style="padding:8px 10px;border-radius:12px;background:var(--surface);border:1px solid ${g.unlocked ? "var(--emerald-bd)" : "var(--hairline)"};display:flex;flex-direction:column;gap:5px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:9.5px;">
          <span style="font-weight:700;color:${g.unlocked ? "var(--emerald)" : "var(--text)"};">loudness spread · target -14 LUFS (${g.leveled.length}/${g.audible.length})</span>
          ${!g.unlocked && g.remaining.length
            ? `<button class="mini-pill-btn em-tint" data-bulk-level>${IC.wave} level ${g.remaining.length} remaining</button>`
            : `<button class="mini-pill-btn" data-reset-audio>reset demo</button>`}
        </div>
        <div class="vc-ruler">
          <div class="vc-ruler-target"></div>
          ${dots}
        </div>
        <div style="display:flex;justify-content:space-between;font-size:8px;color:var(--caption);">
          <span>-32 quiet</span><span style="color:var(--text);font-weight:700;">-14 target</span><span>0 clip</span>
        </div>
      </div>

      <div class="link-two-col" style="grid-template-columns:0.58fr 1.42fr;">
        ${renderHeroGrid(true)}
        <div style="display:flex;flex-direction:column;gap:5px;min-width:0;">
          <div class="sec-lbl"><span>files · in order</span><span>${state.files.length} of 10</span></div>
          <div class="file-list">${renderFileRows(true)}</div>
        </div>
      </div>`;
  } else {
    // VARIATION D: Split Media + Scrollable File Queue + Tactile Floating Bottom Glass Dock
    body = `
      <div class="nav-top">
        <div>
          <h2 class="nav-title" style="font-size:15px;">${state.linkTitle}</h2>
          <div style="font-size:9.5px;color:var(--caption);">${state.files.length} files · ${state.linkPrivate ? "private" : "public"} · today 23:50</div>
        </div>
        <div style="display:flex;gap:5px;align-items:center;">
          <span class="vis-badge ${state.linkPrivate ? "is-priv" : ""}">${state.linkPrivate ? IC.lock + " private" : IC.globe + " public"}</span>
          <button class="mini-pill-btn" data-toggle-discord>${IC.eye} discord</button>
          ${g.unlocked ? `<button class="mini-pill-btn" data-reset-audio>reset</button>` : ""}
        </div>
      </div>

      <div class="link-two-col">
        <div style="display:flex;flex-direction:column;gap:7px;">
          ${renderHeroGrid(true)}
          <div class="badge-row">${renderCollectionPills()}</div>
          ${renderDiscordCard()}
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;min-width:0;">
          <div class="url-pill">
            <span class="url-path">${u.base}<span class="url-q">${u.suffix}</span></span>
            <span style="font-size:9px;font-weight:700;color:${g.unlocked ? "var(--emerald)" : "var(--caption)"};">${g.leveled.length}/${g.audible.length}</span>
          </div>
          ${renderAudioDistBar(g)}
          ${renderEditBar()}
          <div class="sec-lbl"><span>files · in order</span><span>${state.files.length} of 10</span></div>
          <div class="file-list">${renderFileRows(true)}</div>
        </div>
      </div>

      <div class="vd-dock-wrap">
        <button class="cta-primary ${normalOn || isCopied ? "em" : ""}" style="height:32px;flex:1;min-width:130px;" data-copy-detail>
          ${isCopied ? IC.check : IC.copy}
          <span>${isCopied ? "copied" : (normalOn ? "copy ?audio=normal" : "copy link")}</span>
        </button>
        ${!g.unlocked && g.remaining.length
          ? `<button class="mini-pill-btn em-tint" style="height:32px;padding:0 10px;border-radius:10px;" data-bulk-level>${IC.wave} level ${g.remaining.length}</button>`
          : `<button class="mini-pill-btn ${normalOn ? "em-tint" : ""}" style="height:32px;padding:0 9px;border-radius:10px;" data-set-normal="${normalOn ? "0" : "1"}">${IC.wave} normal</button>`}
        <button class="icon-soft-btn blue" data-toast="Share ${u.full}" title="Share">${IC.share}</button>
        <button class="icon-soft-btn ${state.linkEditing ? "em" : ""}" data-toggle-edit title="Edit order">${IC.edit}</button>
        <button class="icon-soft-btn" data-toggle-priv title="Toggle privacy">${state.linkPrivate ? IC.globe : IC.lock}</button>
        <button class="icon-soft-btn red" data-toast="Confirm: Revoke link?" title="Revoke">${IC.revoke}</button>
      </div>`;
  }

  return `
    <div class="duo-device theme-${state.theme} pose-${state.pose}">
      <div class="duo-shell">
        <div class="duo-content">${body}</div>
        ${renderDuoRail("detail")}
      </div>
    </div>`;
}

// ====== COMPARE ALL VIEW ======
function renderCompareAll() {
  const specs = [
    {
      k: "A", name: "A · Adaptive Bento & Unified Share Deck", rec: true,
      items: [
        ["Collections:", "Tight 2/3-col grid with 1/2/3/4-up adaptive covers (0 gray boxes) + 1-tap copy button on every folder."],
        ["Sets:", "Compact purple set chips + inline set bar directly above folders — dead whitespace completely removed."],
        ["Share Link:", "Replaces bulky 2×2 action tiles with a single Liquid Glass Share Deck (audio switch + live URL + bulk level) + slim 4-action strip."],
        ["Best fit:", "Most cohesive with existing Cobalt SwiftUI components; lowest migration risk."]
      ]
    },
    {
      k: "B", name: "B · Editorial Media Posters & Liquid Glass", rec: false,
      items: [
        ["Collections:", "Full-bleed poster cards with Clear Liquid Glass footers — instant visual recognition across video shares."],
        ["Sets:", "Sticky set chips with floating count & freshness pills over media."],
        ["Share Link:", "Cinematic media stage with floating Copy/Share HUD + calm inspector card for ?audio=normal & files."],
        ["Best fit:", "Maximum iOS 27 Liquid Glass visual joy when media thumbnails are the star."]
      ]
    },
    {
      k: "C", name: "C · Series Stacks & Command Inspector", rec: false,
      items: [
        ["Collections:", "Auto-groups numbered series (`Lia Share 37…33`) into a fanned collapsible stack + filter bar & batch select."],
        ["Sets:", "Fast set switching + dense single-line collection rows with zero wasted pixels."],
        ["Share Link:", "Compact top command bar, live LUFS loudness ruler (-32 to 0), and high-density numbered file queue."],
        ["Best fit:", "Power-user speed when managing 30–100+ dated or numbered share collections."]
      ]
    },
    {
      k: "D", name: "D · Compact Tiles & Floating Thumb Dock", rec: false,
      items: [
        ["Collections:", "Horizontal compact tiles (adaptive square thumb + amber title + instant copy) + `split / folders / links` switcher."],
        ["Sets:", "Clean top header keeps sets, folders, and individual links cleanly separated."],
        ["Share Link:", "Media & queue stay unobstructed while primary Copy, ?audio=normal, Share, Edit, Privacy, and Revoke live in a bottom glass dock."],
        ["Best fit:", "One-handed iPhone Duo ergonomics and fastest vertical scanning."]
      ]
    }
  ];

  return `
    <div class="cmp-grid">
      ${specs.map(s => `
        <div class="cmp-card">
          <div class="cmp-head">
            <h3>${s.name}</h3>
            ${s.rec ? `<span class="rec-pill">Recommended</span>` : ""}
          </div>
          <ul class="cmp-bullets">
            ${s.items.map(([k, txt]) => `<li><strong>${k}</strong> ${txt}</li>`).join("")}
          </ul>
          <button class="cmp-jump" data-var="${s.k}">Inspect Variation ${s.k} →</button>
        </div>`).join("")}
    </div>`;
}

// ====== MAIN RENDER ======
function render() {
  // Variation tabs
  document.getElementById("varTabs").innerHTML = ["A", "B", "C", "D", "CMP"].map(k => {
    const active = state.variation === k;
    const cls = active ? (k === "CMP" ? "seg-btn cmp-active" : "seg-btn active") : "seg-btn";
    return `<button class="${cls}" data-var="${k}">${VARIATIONS[k].short}</button>`;
  }).join("");

  // Surface tabs
  document.getElementById("surfaceTabs").innerHTML = [
    ["both", "Both Screens"],
    ["links", "Collections & Sets"],
    ["detail", "Share Link Detail"]
  ].map(([k, lbl]) => `<button class="seg-btn ${state.surface === k ? "active" : ""}" data-surface="${k}">${lbl}</button>`).join("");

  // Pose tabs
  document.getElementById("poseTabs").innerHTML = [
    ["landscape", "Duo Landscape"],
    ["portrait", "Duo Portrait"]
  ].map(([k, lbl]) => `<button class="seg-btn ${state.pose === k ? "active" : ""}" data-pose="${k}">${lbl}</button>`).join("");

  // Theme tabs
  document.getElementById("themeTabs").innerHTML = [
    ["dark", "Dark"],
    ["light", "Light"]
  ].map(([k, lbl]) => `<button class="seg-btn ${state.theme === k ? "active" : ""}" data-theme="${k}">${lbl}</button>`).join("");

  // Brief banner
  const vInfo = VARIATIONS[state.variation];
  document.getElementById("briefHost").innerHTML = `
    <div class="brief-banner">
      <div class="brief-main">
        <h1 class="brief-title">${vInfo.title} ${vInfo.rec ? `<span class="rec-pill">Recommended</span>` : ""}</h1>
        <p class="brief-desc">${vInfo.desc}</p>
      </div>
      <div class="brief-chips">${vInfo.fixes.map(f => `<span class="fix-chip">${f}</span>`).join("")}</div>
    </div>`;

  const stage = document.getElementById("stageHost");
  if (state.variation === "CMP") {
    stage.innerHTML = renderCompareAll();
    return;
  }

  const showLinks = state.surface === "both" || state.surface === "links";
  const showDetail = state.surface === "both" || state.surface === "detail";
  const sideBySide = showLinks && showDetail && state.pose === "portrait";

  stage.innerHTML = `
    <div class="stage-grid ${sideBySide ? "side-by-side-portrait" : ""}">
      ${showLinks ? `
        <div class="screen-block">
          <div class="screen-meta">
            <span><strong>Collections &amp; Sets</strong> · LinksScreen</span>
            <span>Try set chips, rail select ✓, or copy</span>
          </div>
          ${renderLinksScreen(state.variation)}
        </div>` : ""}
      ${showDetail ? `
        <div class="screen-block">
          <div class="screen-meta">
            <span><strong>Share Link Detail</strong> · LinkPanePage</span>
            <span>Try ?audio=normal, level, edit, privacy</span>
          </div>
          ${renderLinkDetailScreen(state.variation)}
        </div>` : ""}
    </div>`;
}

// ====== INTERACTION HANDLERS ======
document.addEventListener("click", (e) => {
  const el = e.target.closest("button, [data-coll-tap], [data-open-detail]");
  if (!el) return;

  if (el.dataset.var) { state.variation = el.dataset.var; render(); return; }
  if (el.dataset.surface) { state.surface = el.dataset.surface; render(); return; }
  if (el.dataset.pose) { state.pose = el.dataset.pose; render(); return; }
  if (el.dataset.theme) { state.theme = el.dataset.theme; render(); return; }

  if (el.dataset.set) {
    state.selectedSet = state.selectedSet === el.dataset.set && el.dataset.set !== "all" ? "all" : el.dataset.set;
    render();
    return;
  }
  if (el.dataset.ltab) { state.linksTabMode = el.dataset.ltab; render(); return; }

  if (el.hasAttribute("data-toggle-select")) {
    state.selectMode = !state.selectMode;
    if (!state.selectMode) state.selectedColls.clear();
    render();
    return;
  }
  if (el.hasAttribute("data-toggle-series")) {
    state.seriesExpanded = !state.seriesExpanded;
    render();
    return;
  }

  if (el.dataset.copyColl) {
    e.stopPropagation();
    const c = COLLECTIONS.find(x => x.id === el.dataset.copyColl);
    flashCopy(c.id, `Copied ${c.links} link${c.links > 1 ? "s" : ""} from ${c.name}`);
    return;
  }
  if (el.dataset.copySet) {
    showToast(`Copied all links in set "${el.dataset.copySet}"`, "ok");
    return;
  }
  if (el.dataset.copyLinkrow) {
    e.stopPropagation();
    const l = INDIVIDUAL_LINKS.find(x => x.id === el.dataset.copyLinkrow);
    flashCopy(l.id, `Copied ${l.url}`);
    return;
  }
  if (el.dataset.collTap) {
    const id = el.dataset.collTap;
    if (state.selectMode) {
      if (state.selectedColls.has(id)) state.selectedColls.delete(id);
      else state.selectedColls.add(id);
      render();
    } else {
      const c = COLLECTIONS.find(x => x.id === id);
      showToast(`Opened collection "${c.name}" (${c.links} ${c.links === 1 ? "link" : "links"})`);
    }
    return;
  }
  if (el.dataset.openDetail) {
    showToast("Focused Share Link detail pane");
    return;
  }

  if (el.hasAttribute("data-toggle-edit")) {
    state.linkEditing = !state.linkEditing;
    render();
    return;
  }
  if (el.hasAttribute("data-save-edit")) {
    state.linkEditing = false;
    showToast("Link updated · undo available", "ok");
    render();
    return;
  }
  if (el.dataset.removeFile) {
    if (state.files.length <= 2) {
      showToast("Share links need at least 2 files", "err");
      return;
    }
    state.files = state.files.filter(f => f.id !== el.dataset.removeFile);
    render();
    return;
  }
  if (el.hasAttribute("data-toggle-priv")) {
    state.linkPrivate = !state.linkPrivate;
    showToast(state.linkPrivate ? "Made private · key link copied" : "Made public · original link active", "ok");
    render();
    return;
  }
  if (el.hasAttribute("data-toggle-discord")) {
    state.showDiscord = !state.showDiscord;
    render();
    return;
  }
  if (el.dataset.toggleLcoll) {
    const name = el.dataset.toggleLcoll;
    if (state.linkColls.has(name)) {
      state.linkColls.delete(name);
      showToast(`Removed from ${name}`);
    } else {
      state.linkColls.add(name);
      showToast(`Added to ${name}`, "ok");
    }
    render();
    return;
  }
  if (el.dataset.setNormal !== undefined) {
    const want = el.dataset.setNormal === "1";
    const g = getGate();
    if (want && !g.unlocked) {
      shakeEl(el);
      showToast(`Locked: ${g.remaining.length} video${g.remaining.length > 1 ? "s" : ""} still need leveling first`, "err");
      return;
    }
    state.useNormalAudio = want;
    render();
    return;
  }
  if (el.hasAttribute("data-bulk-level")) {
    startBulkLevel();
    return;
  }
  if (el.dataset.levelOne) {
    startBulkLevel(el.dataset.levelOne);
    return;
  }
  if (el.hasAttribute("data-reset-audio")) {
    resetAudioDemo();
    return;
  }
  if (el.hasAttribute("data-copy-detail")) {
    const u = activeShareURL();
    flashCopy("detail-copy", `Copied ${u.full}`, u.suffix ? "ok" : "neutral");
    return;
  }
  if (el.dataset.toast) {
    showToast(el.dataset.toast);
    return;
  }
});

document.addEventListener("input", (e) => {
  if (e.target.matches("[data-title-input]")) {
    state.linkTitle = e.target.value;
  }
});

render();
</script>
</body>
</html>
