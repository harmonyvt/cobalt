/* ====== UNIFIED LUFS RULER (LoudnessRulerView.swift) ====== */
.lufs-ruler {
  position: relative;
  padding: 9px 0 13px;
}
.lufs-track {
  position: relative;
  height: 7px;
  border-radius: 99px;
  overflow: hidden;
  border: 0.75px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.08);
}
.lufs-track .z-quiet { position: absolute; left: 0; width: 31.25%; top: 0; bottom: 0; background: rgba(56, 189, 248, 0.48); }
.lufs-track .z-bal { position: absolute; left: 31.25%; width: 31.25%; top: 0; bottom: 0; background: rgba(52, 211, 153, 0.45); }
.lufs-track .z-clip {
  position: absolute; left: 62.5%; width: 4.69%; top: 0; bottom: 0;
  background: repeating-linear-gradient(-45deg, rgba(251, 191, 36, 0.78) 0 2px, rgba(251, 191, 36, 0.18) 2px 5px);
}
.lufs-track .z-loud { position: absolute; left: 67.19%; right: 0; top: 0; bottom: 0; background: rgba(248, 113, 113, 0.52); }
.lufs-target {
  position: absolute;
  top: 5px;
  height: 15px;
  width: 1.5px;
  left: 56.25%; /* -14 LUFS on [-32, 0] */
  background: rgba(255, 255, 255, 0.9);
  border-radius: 1px;
}
.lufs-dot {
  position: absolute;
  top: 12.5px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  border: 1.5px solid #fff;
  transition: left 0.35s ease, background 0.25s ease;
}
.lufs-dot.ok { background: var(--c-emerald); box-shadow: 0 0 6px rgba(52, 211, 153, 0.85); width: 9px; height: 9px; z-index: 3; }
.lufs-dot.loud { background: var(--c-loud); box-shadow: 0 0 5px rgba(248, 113, 113, 0.8); z-index: 2; }
.lufs-dot.quiet { background: var(--c-quiet); box-shadow: 0 0 5px rgba(56, 189, 248, 0.8); z-index: 2; }
.lufs-dot.rendering { background: var(--c-amber); box-shadow: 0 0 6px rgba(251, 191, 36, 0.9); z-index: 4; }
.lufs-axis {
  display: flex;
  justify-content: space-between;
  font-size: 8px;
  color: var(--c-caption);
  margin-top: 4px;
}
.lufs-axis .tgt { color: #e4e4e7; font-weight: 700; }

}
.mini-ruler .mr-dot {

}

  const videos = items.filter(i => i.kind === "video");

  const unleveled = audible.filter(i => i.state !== "ready");
  const queueable = audible.filter(i => i.state !== "ready" && i.state !== "rendering");

  let status = "unlocked";
  if (audible.length === 0) status = "na";
  else if (unleveled.length > 0) status = "blocked";

  const pct = audible.length === 0 ? 100 : Math.round(
    (audible.reduce((acc, it) => acc + (it.state === "ready" ? 100 : it.state === "rendering" ? (it.pct || 25) : 0), 0)) / audible.length
  );

  let reason = "";
  if (status === "na") {
    reason = videos.length === 0 ? "images only · no audio tracks to level" : "silent clips only · no audible tracks";
  } else if (status === "blocked") {
    if (rendering.length > 0) {
      reason = `${unleveled.length} of ${audible.length} video${audible.length === 1 ? "" : "s"} still leveling`;
    } else if (failed.length > 0 && failed.length === unleveled.length) {
      reason = `${failed.length} video${failed.length === 1 ? "" : "s"} failed leveling`;
    } else {
      reason = `${unleveled.length} of ${audible.length} video${audible.length === 1 ? "" : "s"} aren't leveled yet`;
    }
  } else {
    reason = `all ${audible.length} audible video${audible.length === 1 ? "" : "s"} leveled to -14 LUFS`;
  }

  return { status, videos, audible, silent, images, leveled, rendering, failed, unleveled, queueable, pct, reason };
}

function lufsPct(lufs) {
  if (lufs == null || !isFinite(lufs)) return 56.25;
  const clamped = Math.min(0, Math.max(-32, lufs));
  return ((clamped - (-32)) / 32) * 100;
}

function startBulkLevelLink(singleId = null) {
  const targets = singleId
    ? app.linkItems.filter(i => i.id === singleId && i.kind === "video" && i.zone !== "silent" && i.state !== "ready")
    : app.linkItems.filter(i => i.kind === "video" && i.zone !== "silent" && i.state !== "ready");
  if (!targets.length) return;

  targets.forEach((it, idx) => {
    it.error = null;
    if (it.state !== "rendering") {
      it.state = idx < 2 ? "rendering" : "pending";
      it.pct = idx < 2 ? Math.max(it.pct || 0, 14) : 0;
    }
  });
  showToast(`Queued ${targets.length} video${targets.length === 1 ? "" : "s"} for -14 LUFS leveling…`, "neutral");
  render();

  if (app.linkSimTimer) clearInterval(app.linkSimTimer);
  app.linkSimTimer = setInterval(() => {
    const active = app.linkItems.filter(i => i.state === "rendering");
    const waiting = app.linkItems.filter(i => i.state === "pending" && i.kind === "video" && i.zone !== "silent");
    // Keep 2 rendering concurrently
    while (active.length < 2 && waiting.length > 0) {
      const next = waiting.shift();
      next.state = "rendering";
      next.pct = 12;
      active.push(next);
    }
    if (active.length === 0) {
      clearInterval(app.linkSimTimer);
      app.linkSimTimer = null;
      const g = computeGate(app.linkItems);
      if (g.status === "unlocked") {
        app.useNormalLink = true;
        showToast("All videos leveled (-14.0 LUFS) · ?audio=normal unlocked!", "ok");
      }
      render();
      return;
    }
    active.forEach(it => {
      it.pct = Math.min(100, (it.pct || 0) + 22 + Math.floor(Math.random() * 14));
      if (it.pct >= 100) {
        it.state = "ready";
        it.outLufs = -14.0;
        it.pct = 100;

    });
    const g = computeGate(app.linkItems);
    if (g.status === "unlocked") {
      clearInterval(app.linkSimTimer);
      app.linkSimTimer = null;
      app.useNormalLink = true;
      showToast("All videos leveled (-14.0 LUFS) · ?audio=normal unlocked!", "ok");

    render();
  }, 420);
}

// ====== TOAST & CLIPBOARD FEEDBACK ======
let toastTimer = null;
function showToast(msg, tone = "neutral") {
  const el = document.getElementById("toastHost");
  el.textContent = msg;
  el.className = "toast-host show" + (tone === "err" ? " toast-err" : tone === "ok" ? " toast-ok" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove("show"); }, 2600);
}

function triggerShake(el) {
  if (!el) return;
  el.classList.remove("shake");
  void el.offsetWidth;
  el.classList.add("shake");
}

function attemptNormalCopy(el, isShareSheet = false) {
  const g = computeGate(app.linkItems);
  if (g.status !== "unlocked") {
    triggerShake(el);
    if (g.status === "na") {
      showToast("No audible videos in this link — ?audio=normal is not applicable.", "err");
    } else {
      showToast(`Blocked: ${g.reason} — level remaining videos to unlock ?audio=normal`, "err");
    }
    return;
  }
  const url = "share.capybaraharmony.com/g/8962396074701362336?audio=normal";
  showToast(isShareSheet ? `Share sheet opened: ${url}` : `Copied: ${url}`, "ok");
}

function copyBareLink(isShareSheet = false) {
  const url = "share.capybaraharmony.com/g/8962396074701362336";

}

function renderDistBar(g) {
  const total = Math.max(1, g.audible.length + g.images.length + g.silent.length);
  const okW = (g.leveled.length / total) * 100;
  const renW = (g.rendering.length / total) * 100;
  const loudW = (g.unleveled.filter(i => i.state !== "rendering" && (i.zone === "loud" || i.state === "failed")).length / total) * 100;
  const quietW = (g.unleveled.filter(i => i.state !== "rendering" && i.zone !== "loud" && i.state !== "failed").length / total) * 100;
  const imgW = ((g.images.length + g.silent.length) / total) * 100;
  return `
    <div class="dist-bar" title="Leveled / Leveling / Loud / Quiet / Non-audio">
      ${okW ? `<span class="dist-seg ok" style="width:${okW}%"></span>` : ""}
      ${renW ? `<span class="dist-seg rendering pulse" style="width:${renW}%"></span>` : ""}
      ${loudW ? `<span class="dist-seg loud" style="width:${loudW}%"></span>` : ""}
      ${quietW ? `<span class="dist-seg quiet" style="width:${quietW}%"></span>` : ""}
      ${imgW ? `<span class="dist-seg img" style="width:${imgW}%"></span>` : ""}
    </div>`;
}

function renderAggregateRuler(items) {
  const audible = items.filter(i => i.kind === "video" && i.zone !== "silent");
  const dots = audible.map((it, idx) => {
    const val = it.state === "ready" ? (it.outLufs ?? -14.0) : it.lufs;
    const cls = it.state === "ready" ? "ok" : it.state === "rendering" ? "rendering pulse" : it.zone === "loud" ? "loud" : it.zone === "quiet" ? "quiet" : "ok";
    // Tiny horizontal jitter when stacked on -14.0 so multiple leveled dots stay legible
    const jitter = it.state === "ready" ? ((idx % 3) - 1) * 0.7 : 0;
    return `<span class="lufs-dot ${cls}" style="left:${Math.min(97, Math.max(3, lufsPct(val) + jitter))}%" title="${it.title}: ${val.toFixed(1)} LUFS"></span>`;
  }).join("");
  return `
    <div class="lufs-ruler">
      <div class="lufs-track">
        <span class="z-quiet"></span><span class="z-bal"></span><span class="z-clip"></span><span class="z-loud"></span>
      </div>
      <span class="lufs-target"></span>
      ${dots}
      <div class="lufs-axis">
        <span>-32</span><span>-22</span><span class="tgt">-14 target</span><span>-10.5</span><span>0 LUFS</span>
      </div>
    </div>`;
}

// ====== VARIATION RENDERERS — LIBRARY MULTI-SELECT (LibraryPickedSheet) ======
function renderLibrarySheet(variant) {

  const g = computeGate(picked);
  const unlocked = g.status === "unlocked";
  const isNA = g.status === "na";
  const vidCount = g.videos.length;
  const imgCount = g.images.length;
  const kindSummary = [
    vidCount ? `${vidCount} video${vidCount === 1 ? "" : "s"}` : "",
    imgCount ? `${imgCount} image${imgCount === 1 ? "" : "s"}` : "",

  const hasPicks = picked.length > 0;

  // Picked strip
  const stripHtml = hasPicks ? `
    <div class="pick-strip">

          <div class="pick-thumb ${it.art}">
            <span class="pt-num">${idx + 1}</span>

            <span class="pt-dot ${dotCls}"></span>
          </div>`;
      }).join("")}

  // Variation-specific audio integration inside the floating Liquid Glass sheet
  let preGridHtml = "";
  let gridHtml = "";
  let footerHtml = "";

  const standard8Tiles = `

    <button class="sel-tile t-delete" ${!hasPicks ? "disabled" : ""} data-toast="Opened delete confirmation">${IC.trash}<span>delete</span></button>`;

  if (variant === "A") {
    // Slim Liquid Glass audio strip directly between thumbnail rail and 2x4 grid
    if (hasPicks) {
      preGridHtml = `
        <div class="sheet-audio-strip ${unlocked ? "ready-strip" : ""}">
          <span style="display:inline-flex;align-items:center;gap:5px;color:${unlocked ? "#6ee7b7" : g.rendering.length ? "#fde68a" : "#e4e4e7"}">
            ${IC.waveSm}
            ${isNA
              ? "no audible videos selected"
              : unlocked
                ? `all ${g.audible.length} videos leveled (-14 LUFS)`
                : g.rendering.length
                  ? `leveling ${g.leveled.length}/${g.audible.length} (${g.pct}%)…`
                  : `${g.audible.length} video${g.audible.length === 1 ? "" : "s"} · ${g.unleveled.length} need leveling`}
          </span>
          ${!unlocked && !isNA ? `
            <button class="cta-pill ${g.rendering.length ? "soft-amber" : "primary-em"}" style="padding:3.5px 9px;font-size:9.5px" data-bulk-lib>

    }
    gridHtml = `<div class="select-grid">${standard8Tiles}</div>`;
    footerHtml = `
      <div class="sheet-footer">

        ${!unlocked && !isNA && hasPicks ? `<span style="display:inline-flex;align-items:center;gap:4px;white-space:nowrap;color:#fca5a5">${IC.lockSm} ?audio=normal locked</span>` : ""}
      </div>`;
  } else if (variant === "B") {
    // Dedicated 9th 'level audio' tile right inside Cobalt's tile grammar (3x3 balanced grid)
    const lvlTitle = isNA ? "no audio" : unlocked ? "leveled ✓" : g.rendering.length ? `${g.pct}%…` : `level (${g.queueable.length})`;
    const lvlCls = isNA ? "t-neutral" : unlocked ? "t-level" : g.rendering.length ? "t-level-busy" : "t-level";
    gridHtml = `
      <div class="select-grid cols-3">
        <button class="sel-tile t-primary" ${picked.length < 2 ? "disabled" : ""} data-make-link>${IC.link}<span>${normalNewActive ? "link · normal" : "make share link"}</span></button>
        <button class="sel-tile ${lvlCls}" ${isNA || unlocked ? "disabled" : ""} data-bulk-lib>
          ${g.rendering.length ? `<span class="sel-fill-bar" style="width:${g.pct}%"></span>` : ""}
          ${unlocked ? IC.check : IC.wave}
          <span>${lvlTitle}</span>
        </button>
        <button class="sel-tile t-neutral" data-toast="Toggled public / private">${IC.globe}<span>public</span></button>
        <button class="sel-tile t-collection" ${picked.length < 2 ? "disabled" : ""} data-toast="Opened collection picker">${IC.folder}<span>collection</span></button>
        <button class="sel-tile t-add" ${!hasPicks ? "disabled" : ""} data-toast="Opened add to link">${IC.link}<span>add to link</span></button>
        <button class="sel-tile t-share" ${!hasPicks ? "disabled" : ""} data-toast="Sharing ${picked.length} files">${IC.share}<span>share</span></button>

    }
    gridHtml = `<div class="select-grid">${standard8Tiles}</div>`;
    footerHtml = `
      <div class="sheet-footer">
        <span>${picked.length} files · one link</span>
        <button class="normal-opt-pill ${unlocked ? (normalNewActive ? "unlocked-on" : "") : "locked"}" data-toggle-new-normal>
          ${unlocked ? IC.waveSm : IC.lockSm} ${unlocked ? (normalNewActive ? "create with ?audio=normal" : "add ?audio=normal") : `?audio=normal locked (${g.leveled.length}/${g.audible.length})`}
        </button>
      </div>`;
  } else {
    // Variation D: Calm progress sweep along hairline + smart interactive footer bar
    gridHtml = `<div class="select-grid">${standard8Tiles}</div>`;
    footerHtml = `
      <div class="sheet-footer" style="padding-top:3px;border-top:1px solid rgba(255,255,255,0.08)">

              return `
                <button class="lib-tile ${t.art} ${isPicked ? "picked" : ""}" data-pick-tile="${t.id}" title="Click to toggle selection">

                    <span>${t.dur}</span>

            }).join("")}
          </div>

          <div class="picked-sheet-wrap">

              <div class="sheet-hairline">
                ${g.rendering.length ? `<div class="sweep" style="width:${g.pct}%"></div>` : ""}
              </div>
              ${preGridHtml}
              <div class="sheet-actions-wrap">
                ${gridHtml}
                ${footerHtml}
              </div>
            </div>
          </div>
        </div>
        ${renderDuoRail("library")}
      </div>
    </div>`;

        </div>`,
      pros: "Richest audio telemetry (multi-dot LoudnessRulerView across the whole link + per-row level/retry buttons).",
      cons: "Heavier visual footprint for everyday quick sharing; more telemetry than needed when you just want to level & send.",
    },
    {
      id: "D",
      name: "D · 2-Step Guided Gate Rail",
      rec: false,
      wire: `
        <div style="border-radius:8px;border:1px solid #2d2d35;overflow:hidden">
          <div style="padding:5px 7px;background:#141418;display:flex;justify-content:space-between"><span>${unlocked ? "✓" : "1."} level link audio</span><span style="color:#6ee7b7">${unlocked ? "done" : "[level all]"}</span></div>
          <div style="padding:5px 7px;background:${unlocked ? "rgba(16,62,46,0.4)" : "#0b0b0e"};border-top:1px solid #27272d;color:${unlocked ? "#6ee7b7" : "#71717a"}">${unlocked ? "2. share ?audio=normal → [copy] [share]" : "🔒 2. unlocks after step 1"}</div>
        </div>`,
      pros: "Impossible to misunderstand why ?audio=normal is gated; ultra-calm progressive workflow on iPhone Duo.",
      cons: "Takes two stacked rows even when all videos are already leveled; slightly less compact than A.",
    },
  ];
  return `
    <div class="compare-grid">
      ${cards.map(c => `
        <div class="cmp-card ${c.rec ? "recommended" : ""}">
          <div class="cmp-head">
            <h3>${c.name} ${c.rec ? `<span class="rec-badge">Recommended</span>` : ""}</h3>
            <button class="cta-pill soft-ghost" data-jump-var="${c.id}">inspect →</button>
          </div>
          <div class="cmp-mini-wire">${c.wire}</div>
          <ul class="cmp-bullets">
            <li><strong>Strength:</strong> ${c.pros}</li>
            <li><strong>Tradeoff:</strong> ${c.cons}</li>
          </ul>
        </div>`).join("")}
    </div>`;
}

// ====== VARIATION METADATA ======
const VAR_INFO = {
  A: {
    title: "Variation A — Studio Audio Dock + Segmented Address Bar",
    rec: true,
    desc: "Keeps the 2×2 link tiles & 2×4 library grid untouched. Adds a unified Liquid Glass Audio Mode & Gate Dock below the link tiles (with Original vs ?audio=normal switch) and a slim audio strip above the library action grid.",
  },
  B: {
    title: "Variation B — Native Action Grid (Tile-First)",
    rec: false,
    desc: "Expresses bulk leveling and ?audio=normal purely as Cobalt action tiles: expands the link grid to 2×3 (copy link, locked/unlocked copy leveled, live-progress level all) and adds a dedicated level tile to the library multi-select sheet.",
  },
  C: {
    title: "Variation C — Loudness Preflight Inspector",
    rec: false,
    desc: "Plots every video in the link on an aggregate LoudnessRulerView (-32 to 0 LUFS) with an explicit Audio Gate preflight card, per-row level/retry controls, and a collapsible Audio Inspector drawer inside the library select sheet.",
  },
  D: {
    title: "Variation D — 2-Step Guided Gate Rail",
    rec: false,
    desc: "Linear, calm 2-step flow (Step 1: Level link audio → Step 2: Share ?audio=normal) with status filters on the file list and a smart hairline-sweep leveling bar integrated into the library select footer.",
  },
  CMP: {
    title: "Side-by-Side Comparison — All 4 Variations",
    rec: false,
    desc: "Compare the architecture, gate behavior, and tradeoffs of all 4 directions for the currently selected scenario. Click any card's 'inspect →' to interact with the full iPhone Duo prototype.",
  },
};

// ====== MASTER RENDER ======
function render() {
  // Update top tabs & pills
  document.querySelectorAll("#varTabs .var-tab").forEach(b => b.classList.toggle("active", b.dataset.var === app.variation));
  document.querySelectorAll("#scenarioStrip .state-btn").forEach(b => b.classList.toggle("active", b.dataset.scenario === app.scenario));
  document.querySelectorAll("#surfaceSeg button").forEach(b => b.classList.toggle("active", b.dataset.surface === app.surface));

  const g = computeGate(app.linkItems);
  const info = VAR_INFO[app.variation];
  const gatePillCls = g.status === "unlocked" ? "unlocked" : g.status === "na" ? "na" : "blocked";
  const gatePillTxt = g.status === "unlocked"
    ? `${IC.check} ?audio=normal UNLOCKED (${g.leveled.length}/${g.audible.length})`
    : g.status === "na"
      ? `?audio=normal N/A (${g.reason})`
      : `${IC.lockSm} ?audio=normal BLOCKED (${g.leveled.length}/${g.audible.length})`;

  document.getElementById("varBannerHost").innerHTML = `
    <div class="var-banner">
      <div class="var-banner-main">
        <h2>${info.title} ${info.rec ? `<span class="rec-badge">Recommended</span>` : ""}</h2>
        <p>${info.desc}</p>
      </div>
      <div class="gate-pill-live ${gatePillCls}">${gatePillTxt}</div>
    </div>`;

  const stage = document.getElementById("stageHost");
  if (app.variation === "CMP") {
    stage.innerHTML = renderCompareAll();
    return;
  }

  const showLink = app.surface === "both" || app.surface === "link";
  const showLib = app.surface === "both" || app.surface === "library";

  stage.innerHTML = `
    <div class="stage-grid">
      ${showLink ? `
        <div class="screen-card">
          <div class="screen-label">
            <span><strong>Share Link Detail</strong> · LinkPanePage.swift (iPhone Duo)</span>
            <span>Try tapping locked ?audio=normal or bulk level ↓</span>
          </div>
          ${renderLinkPane(app.variation)}
        </div>` : ""}
      ${showLib ? `
        <div class="screen-card">
          <div class="screen-label">
            <span><strong>Library Multi-Select</strong> · LibraryPickedSheet (iPhone Duo)</span>
            <span>Tap grid tiles to mix videos/images · bulk level live ↓</span>
          </div>
          ${renderLibrarySheet(app.variation)}
        </div>` : ""}
    </div>`;
}

// ====== EVENT DELEGATION ======
document.addEventListener("click", (e) => {
  const varBtn = e.target.closest("[data-var]");
  if (varBtn) { app.variation = varBtn.dataset.var; render(); return; }

  const jumpBtn = e.target.closest("[data-jump-var]");
  if (jumpBtn) { app.variation = jumpBtn.dataset.jumpVar; render(); return; }

  const scenBtn = e.target.closest("[data-scenario]");
  if (scenBtn) { loadScenario(scenBtn.dataset.scenario); return; }

  const surfBtn = e.target.closest("[data-surface]");
  if (surfBtn) { app.surface = surfBtn.dataset.surface; render(); return; }

  const bulkLink = e.target.closest("[data-bulk-link]");
  if (bulkLink) { startBulkLevelLink(); return; }

  const levelOne = e.target.closest("[data-level-one]");
  if (levelOne) { startBulkLevelLink(levelOne.dataset.levelOne); return; }

  const bulkLib = e.target.closest("[data-bulk-lib]");
  if (bulkLib) { startBulkLevelLibrary(); return; }

  const setNorm = e.target.closest("[data-set-normal]");
  if (setNorm) {
    const want = setNorm.dataset.setNormal === "1";
    const g = computeGate(app.linkItems);
    if (want && g.status !== "unlocked") {
      triggerShake(setNorm);
      showToast(g.status === "na" ? "No audible videos in this link." : `Blocked: ${g.reason} — level remaining videos first.`, "err");
      return;
    }
    app.useNormalLink = want;
    render();
    return;
  }

  const act = e.target.closest("[data-action]");
  if (act) {
    const kind = act.dataset.action;
    if (kind === "copy-normal") attemptNormalCopy(act, false);
    else if (kind === "share-normal") attemptNormalCopy(act, true);
    else if (kind === "copy-orig") copyBareLink(false);
    else if (kind === "share-orig") copyBareLink(true);
    return;
  }

  const dflt = e.target.closest("[data-dfilter]");
  if (dflt) { app.dFilter = dflt.dataset.dfilter; render(); return; }

  const pickTile = e.target.closest("[data-pick-tile]");
  if (pickTile) {
    const id = pickTile.dataset.pickTile;
    const idx = app.picked.indexOf(id);
    if (idx === -1) app.picked.push(id); else app.picked.splice(idx, 1);
    const g = computeGate(getPickedItems());
    if (g.status !== "unlocked") app.useNormalNewLink = false;
    render();
    return;
  }

  const unpick = e.target.closest("[data-unpick]");
  if (unpick) {
    app.picked = app.picked.filter(x => x !== unpick.dataset.unpick);
    const g = computeGate(getPickedItems());
    if (g.status !== "unlocked") app.useNormalNewLink = false;
    render();
    return;
  }

  if (e.target.closest("[data-clear-picks]")) {
    app.picked = [];
    app.useNormalNewLink = false;
    render();
    return;
  }

  if (e.target.closest("[data-toggle-all]")) {
    if (app.picked.length === app.libTiles.length) app.picked = [];
    else app.picked = app.libTiles.map(t => t.id);
    const g = computeGate(getPickedItems());
    if (g.status !== "unlocked") app.useNormalNewLink = false;
    render();
    return;
  }

  const togNewNorm = e.target.closest("[data-toggle-new-normal]");
  if (togNewNorm) {
    const g = computeGate(getPickedItems());
    if (g.status !== "unlocked") {
      triggerShake(togNewNorm);
      showToast(g.status === "na" ? "Select at least one audible video for ?audio=normal." : `Blocked: ${g.reason} — level selected videos first.`, "err");
      return;
    }
    app.useNormalNewLink = !app.useNormalNewLink;
    render();
    return;
  }

  if (e.target.closest("[data-toggle-cdrawer]")) {
    app.cDrawerOpen = !app.cDrawerOpen;
    render();
    return;
  }

  const makeLink = e.target.closest("[data-make-link]");
  if (makeLink) {
    const g = computeGate(getPickedItems());
    const withNormal = g.status === "unlocked" && app.useNormalNewLink;
    const url = "share.capybaraharmony.com/g/9014820471920411820" + (withNormal ? "?audio=normal" : "");
    showToast(`Created & copied: ${url}`, withNormal ? "ok" : "neutral");
    return;
  }

  const toastBtn = e.target.closest("[data-toast]");
  if (toastBtn) {
    showToast(toastBtn.dataset.toast, "neutral");
    return;
  }
});

// Boot
loadScenario("zero");
</script>
</body>
</html>
