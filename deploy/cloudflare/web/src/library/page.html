<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>capystore library</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
/* Tokens: cobalt's own (web/src/app.css), light and dark by prefers-color-scheme. */
:root {
  --primary: #ffffff; --secondary: #000000; --gray: #6b6b74;
  --red: #c8182a; --green: #1f7a12; --blue: #1f6fd6; --orange: #a65b08;
  --button: #f4f4f4; --button-hover: #ededed; --button-stroke: rgba(0,0,0,0.06);
  --button-text: #282828; --button-elevated: #e3e3e3; --input-border: #adadb7;
  --page: #ffffff; --track: #e9e9ee; --drop: rgba(31,111,214,0.08);
  --radius: 11px;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #000000; --secondary: #e1e1e1; --gray: #9a9aa2;
    --red: #ff6b6b; --green: #5fd35a; --blue: #5aa2ff; --orange: #f5ad5b;
    --button: #191919; --button-hover: #242424; --button-stroke: rgba(255,255,255,0.05);
    --button-text: #e1e1e1; --button-elevated: #282828; --input-border: #383838;
    --page: #000000; --track: #1c1c20; --drop: rgba(90,162,255,0.10);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--secondary); font: 14px/1.5 var(--f-mono); overflow-wrap: anywhere; }
h1, h2, h3, p { margin: 0; font-weight: 600; }
p { font-weight: 400; }
h2 { font-size: 17px; }
button, input, select { font: inherit; color: inherit; }
button, .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
  background: var(--button); color: var(--button-text); border: 0; box-shadow: 0 0 0 1px var(--button-stroke) inset;
  border-radius: var(--radius); padding: 0 12px; min-height: 40px; cursor: pointer; font-weight: 500; text-decoration: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button:hover, .btn:hover { background: var(--button-hover); }
button.primary { background: var(--secondary); color: var(--primary); }
button.primary:hover { opacity: .88; }
button.danger { color: var(--red); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, a:focus-visible, .drop:focus-visible, .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
a { color: inherit; }
.muted { color: var(--gray); }
.small { font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
@media (pointer: coarse), (max-width: 640px) {
  button, .btn { min-height: 44px; }
}

.page {
  max-width: 1120px; margin: 0 auto; display: grid; gap: 16px;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
.bar { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; align-items: center; padding: 6px 14px; background: var(--button); border-radius: 14px; box-shadow: 0 0 0 1px var(--button-stroke) inset; font-size: 12px; }
.bar b { font-size: 13px; }
.bar a.back { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; padding-right: 8px; }
.bar .right { display: inline-flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-left: auto; }
.bar a.nav { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; }
.lock { display: inline-flex; gap: 6px; align-items: center; color: var(--gray); }
.lock::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 8px 14px; border-radius: var(--radius); background: var(--button); color: var(--red); box-shadow: 0 0 0 1px currentColor inset; font-weight: 500; }

.card { background: var(--button); border-radius: var(--radius); padding: 14px; box-shadow: 0 0 0 1px var(--button-stroke) inset; display: grid; gap: 12px; min-width: 0; align-content: start; }
.pane { display: grid; gap: 10px; min-width: 0; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--page); border-radius: var(--radius); padding: 3px; box-shadow: 0 0 0 1px var(--button-stroke) inset; width: fit-content; max-width: 100%; }
.seg button { background: transparent; box-shadow: none; padding: 0 12px; border-radius: 8px; min-height: 36px; }
.seg button:hover { background: var(--button-hover); }
.seg button[aria-pressed="true"] { background: var(--secondary); color: var(--primary); }
@media (pointer: coarse), (max-width: 640px) { .seg button { min-height: 44px; } }

.omni { display: flex; gap: 8px; background: var(--page); border-radius: var(--radius); padding: 6px; box-shadow: 0 0 0 1px var(--input-border) inset; }
.omni input { flex: 1; min-width: 0; background: transparent; border: 0; padding: 0 8px; min-height: 40px; outline: none; font-size: 14px; }
.omni:focus-within { box-shadow: 0 0 0 2px var(--blue) inset; }
@media (pointer: coarse), (max-width: 640px) { .omni input { min-height: 44px; font-size: 16px; } }
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.act { display: grid; gap: 2px; text-align: left; justify-items: start; align-content: center; padding: 8px 12px; min-height: 56px; }
.act b { font-weight: 600; }
.act span { font-size: 11.5px; color: var(--gray); font-weight: 400; }
@media (max-width: 420px) { .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); } .act { padding: 8px 10px; } }

.status { font-size: 12.5px; min-height: 1.4em; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.status.ok { color: var(--green); }
.status.bad { color: var(--red); }
.status code { font-size: 11.5px; color: var(--gray); }
.spin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--gray); border-top-color: transparent; animation: spin .8s linear infinite; flex: none; align-self: center; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.extra { display: flex; gap: 8px; flex-wrap: wrap; }
.linkbox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--page); border-radius: 8px; padding: 6px 6px 6px 10px; box-shadow: 0 0 0 1px var(--input-border) inset; }
.linkbox code { flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; font-size: 12.5px; }

.drop { border: 2px dashed var(--input-border); border-radius: var(--radius); padding: 22px 14px; display: grid; gap: 6px; place-items: center; text-align: center; background: var(--page); cursor: pointer; min-height: 96px; }
.drop.over { border-color: var(--blue); background: var(--drop); }
.files { display: grid; gap: 8px; }
.file { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--page); box-shadow: 0 0 0 1px var(--button-stroke) inset; }
.file .thumb { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; background: var(--track); display: grid; place-items: center; color: var(--gray); font-size: 10px; text-transform: uppercase; }
.file .thumb img, .file .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.file .name { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file .meta { font-size: 11.5px; color: var(--gray); }
.file .meta.bad { color: var(--red); }
.file .meta.ok { color: var(--green); }
.file .opts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.file .opts button, .file .opts .btn { font-size: 12px; padding: 0 10px; min-height: 40px; }
@media (pointer: coarse), (max-width: 640px) { .file .opts button, .file .opts .btn { min-height: 44px; } }
@media (max-width: 560px) { .file { grid-template-columns: 44px minmax(0, 1fr); } .file .opts { grid-column: 1 / -1; justify-content: flex-start; } }
.prog { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 4px; }
.prog i { display: block; height: 100%; background: var(--secondary); width: 0; }

.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.meter-wrap { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--gray); flex-wrap: wrap; }
.meter { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; width: 140px; }
.meter i { display: block; height: 100%; background: var(--secondary); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.tile { background: var(--button); border-radius: var(--radius); box-shadow: 0 0 0 1px var(--button-stroke) inset; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; text-align: left; min-width: 0; align-content: start; }
.thumb-l { display: block; position: relative; aspect-ratio: 16 / 11; background: var(--track); overflow: hidden; color: inherit; text-decoration: none; }
.thumb-l img, .thumb-l video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: var(--track); }
.ph { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 4px; color: var(--gray); font-size: 11px; text-transform: lowercase; }
.ph svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tile .cap { padding: 8px 10px 4px; display: grid; gap: 3px; min-width: 0; align-content: start; }
.tile .name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .meta { font-size: 11px; color: var(--gray); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 10px; padding: 1px 6px; border-radius: 99px; box-shadow: 0 0 0 1px currentColor inset; }
.badge.pub { color: var(--blue); } .badge.priv { color: var(--gray); } .badge.studio { color: var(--orange); }
.tact { display: flex; gap: 6px; padding: 4px 10px 10px; flex-wrap: wrap; align-self: end; align-items: center; }
.tact button, .tact .btn { font-size: 11.5px; padding: 0 8px; min-height: 36px; }
@media (pointer: coarse), (max-width: 640px) { .tact button, .tact .btn { min-height: 44px; } }
.sw { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; min-height: 36px; padding: 0 4px; cursor: pointer; user-select: none; }
.sw input { -webkit-appearance: none; appearance: none; width: 30px; height: 18px; border-radius: 99px; background: var(--track); position: relative; margin: 0; cursor: pointer; box-shadow: 0 0 0 1px var(--button-stroke) inset; transition: background .15s; flex: none; }
.sw input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--gray); transition: transform .15s, background .15s; }
.sw input:checked { background: var(--blue); }
.sw input:checked::after { transform: translateX(12px); background: #fff; }
.sw input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.sw input:disabled { opacity: .5; cursor: default; }
@media (pointer: coarse), (max-width: 640px) { .sw { min-height: 44px; } }
@media (prefers-reduced-motion: reduce) { .sw input, .sw input::after { transition: none; } }
@media (max-width: 420px) { .tact { display: grid; grid-template-columns: minmax(0, 1fr); } }
.confirm { font-size: 11.5px; color: var(--red); padding: 4px 10px 10px; display: grid; gap: 6px; align-self: end; }
.empty { color: var(--gray); font-size: 13px; padding: 10px 0; }
.more { display: flex; justify-content: center; }
.toast { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100vw - 24px); background: var(--secondary); color: var(--primary); padding: 8px 14px; border-radius: 99px; font-size: 12.5px; display: flex; gap: 10px; align-items: center; z-index: 5; }
.toast a { color: inherit; font-weight: 600; }

/* search */
.search { display: grid; gap: 4px; }
.search .omni input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.search .omni kbd { align-self: center; font: inherit; font-size: 11px; color: var(--gray); padding: 1px 7px; border-radius: 6px; box-shadow: 0 0 0 1px var(--input-border) inset; margin-right: 4px; }
.search .omni button { min-height: 36px; font-size: 12px; padding: 0 10px; }
@media (pointer: coarse), (max-width: 640px) { .search .omni kbd { display: none; } .search .omni button { min-height: 44px; } }
.status.warn { color: var(--orange); }
.tile .cap.open { cursor: pointer; border-radius: 6px; }
.tile .cap.open:hover .name { text-decoration: underline; }
.tile .cap.open:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

/* post details */
dialog.sheet { width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); border: 0; padding: 0; border-radius: 14px; background: var(--page); color: var(--secondary); box-shadow: 0 0 0 1px var(--input-border), 0 18px 60px rgba(0,0,0,.35); }
dialog.sheet::backdrop { background: rgba(0,0,0,.45); }
.sheet .in { padding: 16px; display: grid; gap: 14px; }
.sheet .head { display: flex; gap: 10px; align-items: start; justify-content: space-between; }
.sheet .head h2 { font-size: 15px; overflow-wrap: anywhere; }
.sheet .head button { min-height: 36px; flex: none; }
.sheet section { display: grid; gap: 8px; }
.sheet h3 { font-size: 12px; font-weight: 600; color: var(--gray); text-transform: lowercase; letter-spacing: .02em; }
.sheet .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 12.5px; }
.sheet .kv dt { color: var(--gray); }
.sheet .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.badge.ok { color: var(--green); } .badge.wait { color: var(--orange); } .badge.bad { color: var(--red); } .badge.off { color: var(--gray); }
.sheet details { background: var(--button); border-radius: 8px; box-shadow: 0 0 0 1px var(--button-stroke) inset; }
.sheet summary { cursor: pointer; padding: 8px 10px; font-size: 12.5px; min-height: 36px; display: flex; align-items: center; }
.sheet pre { margin: 0; padding: 0 10px 10px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 var(--f-mono); }
.sheet pre b { color: var(--gray); font-weight: 500; }
/* the library's sky: embeddings laid out in 2D as stars and constellations */
:root {
  --sky-top: #fbf7ec; --sky-bottom: #e9e0ca; --sky-star: #1c2448; --sky-line: rgba(28,36,72,.30);
  --sky-label: #3c4777; --sky-halo: rgba(251,247,236,.9); --sky-hit: #c2410c; --sky-tip: rgba(253,250,242,.95);
}
@media (prefers-color-scheme: dark) {
  :root {
    --sky-top: #141c44; --sky-bottom: #04050d; --sky-star: #fbf7ee; --sky-line: rgba(176,196,255,.32);
    --sky-label: #c3ceff; --sky-halo: rgba(4,5,13,.85); --sky-hit: #ffd27a; --sky-tip: rgba(10,13,32,.92);
  }
}
.views { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
.views .status { flex: 1 1 240px; }
.mapwrap { position: relative; border-radius: 14px; background: var(--sky-bottom); box-shadow: 0 0 0 1px var(--button-stroke) inset; overflow: hidden; touch-action: none; }
.mapwrap canvas { display: block; cursor: grab; }
.mapwrap canvas.drag { cursor: grabbing; }
.mapwrap canvas.hot { cursor: pointer; }
.mapwrap .tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
.mapwrap .tools button { min-height: 32px; font-size: 11px; padding: 0 10px; background: var(--sky-tip); color: var(--sky-label); box-shadow: 0 0 0 1px var(--sky-line) inset; letter-spacing: .04em; }
.maptip { position: absolute; pointer-events: none; z-index: 2; width: 190px; background: var(--sky-tip); color: var(--secondary); border-radius: 12px; box-shadow: 0 0 0 1px var(--sky-line), 0 10px 30px rgba(0,0,0,.3); overflow: hidden; font-size: 11.5px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.maptip img { display: block; width: 100%; aspect-ratio: 16 / 11; object-fit: cover; background: var(--track); }
.maptip div { padding: 7px 9px; display: grid; gap: 2px; }
.maptip b { font-weight: 500; overflow-wrap: anywhere; }
.maptip span { color: var(--sky-label); font-size: 10.5px; letter-spacing: .03em; }
#sheetEmbBody { display: grid; gap: 8px; }
.emb { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
.emb figure { margin: 0; display: grid; gap: 6px; justify-items: start; }
.emb figcaption { font-size: 11px; color: var(--gray); max-width: 208px; }
.emb canvas { display: block; border-radius: 10px; box-shadow: 0 0 0 1px var(--button-stroke) inset; }
.near { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.near button { width: 100%; justify-content: flex-start; min-height: 36px; font-size: 12px; font-weight: 400; gap: 10px; text-align: left; }
.near button b { font-weight: 600; font-variant-numeric: tabular-nums; flex: none; width: 3.2em; color: var(--blue); }
.near button span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips span { font-size: 11px; padding: 2px 9px; border-radius: 99px; box-shadow: 0 0 0 1px var(--input-border) inset; letter-spacing: .03em; }
@media (pointer: coarse), (max-width: 640px) { .near button { min-height: 44px; } .mapwrap .tools button { min-height: 44px; } }
</style>
</head>
<body>
<div class="page">
  <header class="bar">
    <a class="back" href="/">&larr; capystore</a>
    <b>library</b>
    <span class="right"><a class="nav" href="/logs">logs</a><span class="lock">signed in &middot; only you</span></span>
  </header>

  <div class="banner" id="banner" role="alert" hidden>
    <span>your login expired, reload to sign in</span>
    <button id="reload" class="primary" type="button">reload</button>
  </div>

  <main style="display:grid; gap:16px">
    <section class="card" aria-label="add something">
      <div class="seg" role="group" aria-label="add from">
        <button id="tabLink" type="button" aria-pressed="true">from a link</button>
        <button id="tabFiles" type="button" aria-pressed="false">from your files</button>
      </div>

      <div class="pane" id="linkPane">
        <form class="omni" id="linkForm" autocomplete="off">
          <input id="link" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="paste a link (x, tiktok, bluesky…)" aria-label="link">
        </form>
        <div class="actions" id="actions">
          <button class="act" type="button" data-act="webp"><b>make webp</b><span>the whole clip, up to 30 s &rarr; public link</span></button>
          <button class="act" type="button" data-act="studio"><b>open in studio</b><span>pick the part you want, then make a webp</span></button>
          <button class="act" type="button" data-act="host"><b>host as-is</b><span>the original file (mp4/gif/image) &rarr; public link</span></button>
          <button class="act" type="button" data-act="keep"><b>keep a private copy</b><span>saved to your library, no public link</span></button>
        </div>
        <div class="status" id="linkStatus" role="status" aria-live="polite"></div>
        <div class="extra" id="linkExtra"></div>
        <div class="linkbox" id="linkResult" hidden><code id="linkResultUrl"></code><button id="copyLinkResult" type="button">copy</button><a class="btn" id="openLinkResult" href="#" target="_blank" rel="noopener">open</a></div>
      </div>

      <div class="pane" id="filesPane" hidden>
        <input id="pick" class="sr" type="file" multiple tabindex="-1" aria-label="choose files" accept="image/gif,image/webp,image/png,image/jpeg,video/mp4,video/quicktime,image/heic,.gif,.webp,.png,.jpg,.jpeg,.mp4,.mov,.heic">
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="choose files or drop them here">
          <b>drop files here, or tap to choose</b>
          <span class="small muted">gif, webp, png, jpg, mp4, mov, heic &middot; up to 100 MB each &middot; on a phone this opens your photos</span>
        </div>
        <div class="files" id="files"></div>
        <div class="status" id="filesStatus" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section style="display:grid; gap:10px" aria-label="your library">
      <div class="filters">
        <div class="seg" role="group" aria-label="show" id="filters">
          <button type="button" data-f="all" aria-pressed="true">all</button>
          <button type="button" data-f="public" aria-pressed="false">public links</button>
          <button type="button" data-f="private" aria-pressed="false">private</button>
          <button type="button" data-f="studio" aria-pressed="false">studios</button>
        </div>
        <div class="meter-wrap"><span id="usage">&nbsp;</span><div class="meter" id="meter" role="img" aria-label="storage used"><i id="meterFill" style="width:0"></i></div></div>
      </div>
      <div class="search">
        <form class="omni" id="searchForm" role="search" autocomplete="off">
          <input id="q" type="search" maxlength="200" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="search your library" aria-label="search your library" aria-describedby="searchStatus">
          <kbd aria-hidden="true">/</kbd>
          <button id="qClear" type="button" hidden>clear</button>
        </form>
        <div class="status" id="searchStatus" role="status" aria-live="polite"></div>
      </div>
      <div class="views">
        <div class="seg" role="group" aria-label="view" id="views">
          <button type="button" data-v="grid" aria-pressed="true">grid</button>
          <button type="button" data-v="map" aria-pressed="false">sky map</button>
        </div>

<script>
/* ---------- constants ---------- */
var MAX_BYTES = 100000000;          // contract: bytes <= 100_000_000
var LIMIT_S = 30;                   // webp length limit (WEBP_MAX_SECONDS)
var FREE_BYTES = 10e9;              // the 10 GB meter
var PAGE_SIZE = 48;
var DEFAULT_API = "https://api.capybaraharmony.com";
var MEDIA_BASE = "https://media.capybaraharmony.com/";
var SHARE_BASE = "https://share.capybaraharmony.com/";
// A public file is handed out as its rich link page (APP-API-CONTRACT.md section 22): media.../<name>.<ext> -> share.../<name>.
// Anything else (a studio page, another host) is returned as is.
function shareUrl(u) {
  var s = String(u || "");
  if (s.indexOf(MEDIA_BASE) !== 0) return s;
  var m = /^([A-Za-z0-9]{6,40})\.[A-Za-z0-9]{1,8}$/.exec(s.slice(MEDIA_BASE.length));

}
// content type -> extension (the server accepts exactly these)
var TYPES = { "image/gif": "gif", "image/webp": "webp", "image/png": "png", "image/jpeg": "jpg", "video/mp4": "mp4", "video/quicktime": "mov", "image/heic": "heic" };
var EXT_TYPE = { gif: "image/gif", webp: "image/webp", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", mp4: "video/mp4", mov: "video/quicktime", heic: "image/heic", heif: "image/heic" };
var CONVERTIBLE = { gif: 1, mp4: 1, mov: 1 };   // webp and heic: host only (ffmpeg here can't decode them)

/* ---------- api base for the studio render calls (public routes, no cookie) ---------- */
var API = DEFAULT_API;
try {
  if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
    var q = new URLSearchParams(location.search).get("api");
    if (q && /^https?:\/\/[^\/?#]+$/.test(q)) API = q;
  }
} catch (e) {}

/* ---------- helpers ---------- */
var $ = function (id) { return document.getElementById(id); };
var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
function h(tag, attrs) {
  var el = document.createElement(tag);

}
function fmtBytes(n) {

  if (n >= 1e6) return (n / 1e6).toFixed(1) + " MB";
  if (n >= 1e3) return Math.round(n / 1e3) + " KB";
  return n + " B";
}
function fmtSecs(s) { return (Math.round(s * 10) / 10) + " s"; }
function fmtElapsed(ms) { var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function ago(ms) {
  var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 129600) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}
function inDays(ms) {
  var s = Math.max(0, Math.round((ms - Date.now()) / 1000));
  if (s < 5400) return "under 2 h";

  return Math.round(s / 86400) + " d";
}
function hostOf(u) { try { return new URL(u).host.replace(/^www\./, ""); } catch (e) { return ""; } }
function isVideoType(t) { return !!t && t.indexOf("video/") === 0; }
function isImageType(t) { return !!t && t.indexOf("image/") === 0 && t !== "image/heic" && t !== "image/heif"; }

/* ---------- errors ---------- */
function Fail(code) { this.code = code; this.message = code; }

var MESSAGES = {
  "network": "can't reach the server right now. check your connection and try again.",
  "expired": "your login expired, reload to sign in.",
  "error.library.invalid_url": "that doesn't look like a link. it should start with https://",
  "error.library.bad_request": "that request wasn't valid.",
  "error.library.upstream": "the server couldn't reach capystore's api. try again in a moment.",
  "error.library.timeout": "this is taking too long. try again.",
  "error.library.unsupported": "that file type isn't supported.",
  "error.library.too_large": "too big: the limit is 100 MB.",
  "error.library.empty": "that file is empty.",
  "error.library.incomplete": "the upload didn't finish. try again.",
  "error.library.missing": "the stored file is gone.",
  "error.library.not_found": "that isn't in your library anymore.",
  "error.library.already_public": "that already has a public link.",
  "error.library.not_toggleable": "that file is always public. delete it to remove the link.",
  "error.library.storage": "couldn't update public storage. try again.",
  "error.api.generic": "the server couldn't do that right now. try again in a moment.",
  "error.library.no_duration": "couldn't read how long this clip is. trim it in studio instead.",
  "error.library.too_short": "this clip is shorter than 0.5 s, so a webp can't be made.",
  "error.studio.no_link": "no link found in that text.",
  "error.studio.busy": "another save or encode is running. try again in a moment.",
  "error.studio.too_large": "that video is over the 200 MB limit, so it wasn't saved.",
  "error.studio.expired": "that studio expired.",
  "error.studio.not_found": "that studio doesn't exist anymore.",
  "error.studio.not_video": "only videos and gifs can be opened in studio.",
  "error.studio.not_ready": "that studio isn't ready yet.",
  "error.studio.storage": "couldn't copy the file to public storage. try again.",
  "error.webp.too_long": "this clip is over 30 s. use \"open in studio\" to pick a part.",
  "error.webp.busy": "another webp is being made right now. try again in a moment.",
  "error.webp.invalid_params": "that clip can't be made into a webp.",
  "error.search.off": "search isn't set up on the server.",
  "error.search.waking": "search is waking up, try again in a minute.",
  "error.search.failed": "search failed. try again in a moment."
};
function messageFor(code) {
  if (MESSAGES[code]) return MESSAGES[code];
  if (code && code.indexOf("error.api.") === 0) return "capystore couldn't fetch this link. the post may be private, removed, or from a site capystore can't read.";
  if (code && code.indexOf("error.webp.") === 0) return "couldn't make the webp.";
  return "something went wrong.";
}
function describe(e) {
  var code = e && e.code ? e.code : "error";

}

/* ---------- requests ---------- */
function showExpired() { $("banner").hidden = false; }
$("reload").onclick = function () { location.reload(); };
// Same-origin library API. redirect: "manual": an expired Access session answers
// with a redirect to the login page, which must surface as "expired", not a crash.
async function lib(path, init, timeoutMs) {

  if (res.type === "opaqueredirect" || res.status === 0 || res.status === 401) { showExpired(); throw new Fail("expired"); }

  try { body = await res.json(); } catch (e) {}

}
function libPost(path, body) {

}
function errCode(r) { return r && r.body && r.body.error && r.body.error.code || ""; }

function ok(r) {

  throw new Fail(errCode(r) || "error.library.upstream");
}
// Public studio routes, straight to the API (id-as-credential, no cookies).
async function direct(path, body) {
  var res;

    res = await fetch(API + path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), cache: "no-store" } : { cache: "no-store" });
  } catch (e) { throw new Fail("network"); }

  try { j = await res.json(); } catch (e) {}

}

// Long-poll until done. `step` returns {done, value} or throws; network blips retry.
async function pollLoop(step, limitMs) {
  var end = Date.now() + (limitMs || 6 * 60000), fails = 0;
  for (;;) {

    var t0 = Date.now(), r;

    catch (e) {
      if (!(e instanceof Fail) || e.code !== "network") throw e;
      if (++fails > 4) throw e;
      await sleep(1500 * fails);
      continue;
    }
    if (r.done) return r.value;
    var spent = Date.now() - t0;
    if (spent < 800) await sleep(1000 - spent);
  }
}
function waitStudio(sid) {
  return pollLoop(async function () {
    var r = await lib("/api/library/studio/" + sid + "?wait=20", {}, 45000);
    var b = r.body;
    if (r.status >= 500 && !(b && b.status)) throw new Fail("network");
    if (!b || typeof b !== "object") throw new Fail("error.library.upstream");
    if (b.status === "error" || r.status >= 400) throw new Fail(errCode(r) || (b.error && b.error.code) || "error.library.upstream");
    return { done: b.status === "ready", value: b };
  });
}

    var b = r.body;
    if (r.status >= 500 && !(b && b.status)) throw new Fail("network");
    if (!b || typeof b !== "object") throw new Fail("error.library.upstream");
    if (b.status === "error" || r.status >= 400) throw new Fail(errCode(r) || "error.library.upstream");
    return { done: b.status === "success", value: b };
  });
}
function waitRender(sid, job) {

    var b = r.body;
    if (r.status >= 500 && !(b && b.status)) throw new Fail("network");
    if (!b || typeof b !== "object") throw new Fail("error.library.upstream");
    if (b.status === "error" || r.status >= 400) throw new Fail(errCode(r) || "error.library.upstream");

  });

/* ---------- toast, copy ---------- */
var toastTimer = 0;
function toast(msg, link) {
  var t = $("toast");
  t.textContent = msg;
  if (link) t.append(h("a", { href: link.href, target: "_blank", rel: "noopener", text: link.label }));
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, link ? 8000 : 2200);
}
async function copyText(text) {

    await navigator.clipboard.writeText(text);

    return;
  } catch (e) {}

  document.body.append(ta);
  ta.select();

}
// Call synchronously from a click handler: the blank tab is opened inside the
// user gesture (popup blockers), then pointed at the studio once it exists.
function openTabFor(makeUrl) {
  var w = null;
  try { w = window.open("about:blank", "_blank"); if (w) w.opener = null; } catch (e) {}
  return makeUrl().then(function (url) {
    if (w) { w.location.href = url; }
    else toast("studio ready", { href: url, label: "open" });
    return url;
  }, function (e) { if (w) w.close(); throw e; });
}

/* ---------- panes ---------- */
function setPane(name) {
  var l = name === "link";
  $("linkPane").hidden = !l; $("filesPane").hidden = l;
  $("tabLink").setAttribute("aria-pressed", String(l));
  $("tabFiles").setAttribute("aria-pressed", String(!l));
}
$("tabLink").onclick = function () { setPane("link"); };
$("tabFiles").onclick = function () { setPane("files"); };

/* ---------- from a link ---------- */
var linkBusy = false;
function linkStatus(kind, text, code, spinning) {
  var el = $("linkStatus");
  el.className = "status" + (kind ? " " + kind : "");
  el.textContent = "";
  if (spinning) el.append(h("span", { class: "spin", "aria-hidden": "true" }));
  el.append(h("span", { text: text }));
  if (code) el.append(h("code", { text: code }));
}
function setLinkButtons(disabled) {
  document.querySelectorAll("#actions button").forEach(function (b) { b.disabled = disabled; });
}
function showResult(url, text) {
  $("linkResultUrl").textContent = shareUrl(url);
  $("openLinkResult").href = shareUrl(url);
  $("linkResult").hidden = false;
  linkStatus("ok", text);
}
async function runLink(act) {
  if (linkBusy) return;
  $("linkResult").hidden = true;
  $("linkExtra").textContent = "";
  var text = $("link").value.trim();
  if (!text) { linkStatus("bad", "paste a link first"); $("link").focus(); return; }
  if (!/https?:\/\/\S/i.test(text)) { linkStatus("bad", messageFor("error.library.invalid_url"), "error.library.invalid_url"); return; }
  linkBusy = true; setLinkButtons(true);
  var began = Date.now();
  var phase = "starting";
  var tick = setInterval(function () { linkStatus("", phase + "… " + fmtElapsed(Date.now() - began), "", true); }, 1000);
  linkStatus("", phase + "…", "", true);
  try {
    if (act === "webp") {
      phase = "making your webp";
      var r = ok(await libPost("/api/library/link", { url: text, action: "webp" }));
      var out = await waitWebp(r.job);
      clearInterval(tick);
      showResult(out.url, "webp ready" + (out.bytes ? " · " + fmtBytes(out.bytes) : "") + (out.seconds ? " · " + fmtSecs(out.seconds) : ""));
      refreshGrid();
    } else if (act === "studio") {
      phase = "opening studio";
      var url = await openTabFor(async function () {
        var s = ok(await libPost("/api/library/link", { url: text, action: "studio" }));
        return s.url;
      });
      clearInterval(tick);
      $("linkResultUrl").textContent = url;
      $("openLinkResult").href = url;
      $("linkResult").hidden = false;
      linkStatus("ok", "studio opened in a new tab");
      refreshGrid();
    } else {
      phase = "saving the video";
      var s2 = ok(await libPost("/api/library/link", { url: text, action: act }));
      await waitStudio(s2.studio);
      if (act === "host") {
        phase = "publishing";
        var p = ok(await libPost("/api/library/studio/" + s2.studio + "/publish"));
        clearInterval(tick);
        showResult(p.url, "hosted as-is" + (p.bytes ? " · " + fmtBytes(p.bytes) : ""));
      } else {
        clearInterval(tick);

      }

    }

    clearInterval(tick);

}
document.querySelectorAll("#actions button").forEach(function (b) { b.onclick = function () { runLink(b.dataset.act); }; });
$("linkForm").addEventListener("submit", function (e) { e.preventDefault(); runLink("webp"); });
$("copyLinkResult").onclick = function () { copyText($("linkResultUrl").textContent); };

/* ---------- from your files ---------- */
var files = [];           // entries, newest last
var nextFileId = 1;
var uploading = 0;
var queue = [];

function convertible(f) { return !!CONVERTIBLE[f.ext]; }

  var box = h("div", { class: "thumb", "aria-hidden": "true" });

  if (isImageType(t)) {
    var img = h("img", { alt: "", src: f.preview });
    img.addEventListener("error", function () { img.remove(); box.textContent = f.ext; });
    box.append(img);
  } else if (isVideoType(t)) {
    var v = h("video", { muted: true, playsinline: true, preload: "metadata", src: f.preview + "#t=0.1" });
    v.muted = true;

}
function fileOptions(f) {

    o.push(remove);
  } else if (f.state === "done") {

      o.push(h("button", { type: "button", "data-fa": "copy", text: "copy link", onclick: function () { copyText(shareUrl(f.url)); } }));
      o.push(h("a", { class: "btn", "data-fa": "open", href: shareUrl(f.url), target: "_blank", rel: "noopener", text: "open" }));
    }
    o.push(remove);
  } else if (f.state === "failed") {
    o.push(h("button", { type: "button", "data-fa": "retry", text: "retry upload", onclick: function () { f.state = "queued"; f.pct = 0; f.note = ""; renderFile(f); enqueue(f); } }));
    o.push(remove);

  }

}

  else if (f.state === "uploading") line = "uploading " + f.pct + "%";
  else if (f.state === "working") line = f.busyText || "working…";
  else if (f.state === "failed") { line = f.note; cls = "bad"; }

    else if (f.ext === "webp") line = "uploaded · webp: can be hosted as-is";

        h("div", { class: "name", text: f.name, title: f.name }),

}
function renderProgress(f) {
