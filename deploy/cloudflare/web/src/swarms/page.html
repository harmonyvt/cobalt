<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE work tool, capystore house style: quiet, dense, exact
   IDEA one page per swarm: approve the plan, watch the batches, review the diff, apply it
   COLOUR black ground, #191919 surfaces, 7TV cyan for "new", red for clashes and failures, green for done
   TYPE Inter throughout, tabular figures in counts, nothing under 13px */
:root{color-scheme:light dark;--bg:light-dark(#f4f4f4,#000);--surface:light-dark(#fff,#191919);--el:light-dark(#ececec,#282828);--text:light-dark(#141414,#e1e1e1);--cap:light-dark(#666,#8f8f8f);--border:light-dark(#dcdcdc,#383838);--ok:#30bd1b;--err:#ff5c6c;--tv:light-dark(#0796b0,#29d8f6);--amber:#f5ad5b}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:24px}
body.hasbar{padding-bottom:110px}
button,input,select{font:inherit;color:inherit}
a{color:var(--tv)}
.wrap{max-width:1040px;margin:0 auto;padding:20px max(16px,4vw)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:14px}
.head{padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
h1{font-size:clamp(24px,4vw,34px);line-height:1.1;letter-spacing:-.02em;margin:0 0 6px;font-weight:800;text-wrap:balance;overflow-wrap:anywhere}
h2{font-size:18px;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--cap);margin:0;font-size:14px;overflow-wrap:anywhere}
.figs{display:flex;gap:22px;flex-wrap:wrap}
.fg b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fg small{color:var(--cap);font-size:13px}
.st-pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--el);white-space:nowrap}
.st-pill.running,.st-pill.stopping{color:var(--amber)}.st-pill.done{color:var(--ok)}.st-pill.failed,.st-pill.expired,.st-pill.declined,.st-pill.stopped{color:var(--err)}.st-pill.awaiting_approval{color:var(--tv)}
.pad{padding:20px 22px}
.strip{padding:0 22px 18px}
.strip p{margin:0 0 8px;font-size:13px;color:var(--cap)}
.cells{display:flex;gap:4px;flex-wrap:wrap}
.cell{min-width:44px;height:44px;border-radius:6px;border:0;background:var(--el);font-size:13px;font-weight:600;color:var(--text);cursor:pointer;font-variant-numeric:tabular-nums}
.cell.done{background:color-mix(in srgb,var(--ok) 70%,transparent);color:#000}
.cell.failed{background:var(--err);color:#000}
.cell.running{background:color-mix(in srgb,var(--amber) 80%,transparent);color:#000}
.cell.skipped{opacity:.5}
.cell.on{outline:2px solid var(--text);outline-offset:1px}
.cells.dense .cell{min-width:0;width:22px;height:22px;font-size:13px;cursor:default;padding:0;font-size:0}
.spec{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:0;font-size:14px}
.spec dt{color:var(--cap)}.spec dd{margin:0;overflow-wrap:anywhere}
.prompt{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;max-height:340px;overflow:auto;margin:6px 0 0}
.args{grid-column:1/-1;font:13px/1.45 ui-monospace,Menlo,monospace;color:var(--cap);overflow-wrap:anywhere;word-break:break-word;margin:0 0 0 0;padding:0 0 4px 0}
.args span{margin-right:10px;display:inline-block}
.hint{margin:0 0 10px;font-size:13px;color:var(--cap)}
.unscoped{color:var(--err);font-weight:600}
.chips2 span{display:inline-block;max-width:100%;overflow-wrap:anywhere;font:13px/1.4 ui-monospace,Menlo,monospace;background:var(--el);border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0}
details.sch summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--tv)}
details.sch pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.45 ui-monospace,Menlo,monospace;margin:0;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;max-height:260px;overflow:auto}
.tag{display:inline-block;background:var(--el);border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;font-size:13px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.go{background:var(--tv);color:#000;border:0;border-radius:10px;padding:11px 20px;min-height:44px;font-weight:700;cursor:pointer;white-space:nowrap}
.go:disabled{opacity:.4;cursor:default}
.ghost{background:var(--el);color:var(--text)}
.danger{background:color-mix(in srgb,var(--err) 20%,var(--el));color:var(--text)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--tv);outline-offset:2px}
.meter{height:8px;border-radius:4px;background:var(--el);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--tv);width:0;transition:width .25s}
.meter.cap i{background:var(--amber)}
.note{margin:0 0 14px;padding:12px 14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--err) 50%,var(--border));background:color-mix(in srgb,var(--err) 8%,var(--surface));font-size:14px;overflow-wrap:anywhere}
.note.info{border-color:var(--border);background:var(--surface)}
.note ul{margin:6px 0 0;padding-left:18px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px;align-items:center}
.tools input[type=search]{flex:1 1 200px;min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface);padding:8px 12px;font-size:16px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:44px;cursor:pointer;font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{border-color:var(--tv);color:var(--tv)}
.chip i{font-style:normal;color:var(--cap);margin-left:4px;font-variant-numeric:tabular-nums}
.bulk{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.lnk{background:none;border:0;color:var(--tv);cursor:pointer;padding:6px 8px;min-height:44px;font-size:14px}
.rows{overflow:hidden}
.grp{padding:10px 18px;font-size:13px;color:var(--cap);background:var(--el);border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}
.grp:first-child{border-top:0}
.row{display:grid;grid-template-columns:44px 48px minmax(0,1fr) minmax(0,1.2fr) 150px;gap:10px;align-items:center;padding:6px 18px 6px 4px;border-top:1px solid var(--border)}
.row.off{opacity:.5}
.tick{display:flex;align-items:center;justify-content:center;width:44px;height:44px;cursor:pointer}
.tick input{width:22px;height:22px;accent-color:var(--tv);cursor:pointer;margin:0}
.emo{width:48px;height:48px;border-radius:8px;background:var(--el);object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--cap);font-size:18px}
.old{font-weight:600;overflow-wrap:anywhere}
.old small{display:block;font-weight:400;color:var(--cap);font-size:13px}
.new{display:flex;align-items:flex-start;gap:8px}
.new .arr{color:var(--cap);line-height:44px}
.new .box{flex:1}
.new input[type=text]{width:100%;min-height:44px;border-radius:8px;border:1px solid var(--border);background:var(--bg);padding:6px 10px;font-size:16px;color:var(--tv);font-weight:600}
.new input.bad{border-color:var(--err);color:var(--err)}
.new .set{color:var(--tv);font-weight:600;line-height:44px;overflow-wrap:anywhere}
.warn{font-size:13px;color:var(--err);display:block;margin-top:3px;overflow-wrap:anywhere}
.warn:empty{display:none}
.why{font-size:13px;color:var(--cap);text-align:right;overflow-wrap:anywhere}
.stt{font-size:13px;font-weight:600;text-align:right;overflow-wrap:anywhere}
.stt.ok{color:var(--ok)}.stt.err{color:var(--err)}.stt.run{color:var(--amber)}
.empty{padding:40px 18px;text-align:center;color:var(--cap)}
.more{display:block;margin:12px auto}
.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px max(16px,4vw) calc(12px + env(safe-area-inset-bottom,0px));z-index:3}
.bar[hidden]{display:none}
.bar .in{max-width:1040px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar p{margin:0;font-size:14px;color:var(--cap);flex:1 1 220px;overflow-wrap:anywhere}
.bar p b{color:var(--text)}
.bar .meter{flex:1 1 220px;margin:0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.sheet.show{display:flex}
.sheet .card{max-width:440px;width:100%;padding:22px;margin:0;max-height:90vh;overflow:auto}
.sheet ul{padding-left:18px;margin:10px 0 16px;color:var(--cap);font-size:14px}
.lock{font-size:13px;color:var(--cap);margin:0 0 12px}
.res{display:grid;grid-template-columns:70px 90px minmax(0,1fr);gap:8px 12px;padding:10px 18px;border-top:1px solid var(--border);align-items:start;font-size:14px}
.res:first-child{border-top:0}
.res pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0;font:13px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;max-height:320px;overflow:auto}
.res summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--tv)}
.res .err{color:var(--err);overflow-wrap:anywhere}
.reduce{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.bst{display:flex;gap:3px;flex-wrap:wrap;padding:12px 18px 0}
.ba{width:22px;height:22px;border-radius:5px;border:0;padding:0;background:var(--el);cursor:pointer}
.ba.good{background:var(--ok)}.ba.mid{background:var(--amber)}.ba.low{background:color-mix(in srgb,var(--err) 50%,var(--el))}.ba.bad{background:var(--err)}
.ba[aria-pressed=true]{outline:2px solid var(--text);outline-offset:1px}
.btools{padding:0 18px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:12px 18px 18px}
.bc{border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--bg);min-width:0}
.bc .pics{display:flex;gap:4px;height:96px;align-items:center;justify-content:center;background:var(--el);border-radius:8px;margin-bottom:6px;overflow:hidden}
.bc .pics img{max-height:96px;max-width:100%;object-fit:contain}
.bc b{display:block;overflow-wrap:anywhere;font-size:14px}
.bc .sc{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.bc .sc.good{color:var(--ok)}.bc .sc.mid{color:var(--amber)}.bc .sc.low{color:var(--err)}
.bc small{display:block;color:var(--cap);font-size:12px;overflow-wrap:anywhere}
.bc details summary{cursor:pointer;color:var(--tv);font-size:13px;min-height:32px;display:flex;align-items:center}
.list a.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 18px;border-top:1px solid var(--border);color:var(--text);text-decoration:none;min-height:44px}
.list a.item:first-child{border-top:0}
.list a.item:hover{background:var(--el)}
.list a.item span{color:var(--cap);font-size:13px}
.list a.item b{overflow-wrap:anywhere}
@media(max-width:640px){.head{grid-template-columns:1fr}.row{grid-template-columns:44px 40px minmax(0,1fr);row-gap:6px;padding-right:12px}.emo{width:40px;height:40px}.new{grid-column:2/-1}.why,.stt{grid-column:2/-1;text-align:left}.bulk{margin-left:0}.res{grid-template-columns:60px minmax(0,1fr)}.res>:nth-child(3){grid-column:1/-1}.spec{grid-template-columns:1fr;gap:0}.spec dd{margin-bottom:8px}}
@media(prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="head"></div>
  <div id="body"><div class="card pad">Loading…</div></div>
</div>
<div class="bar" id="bar" hidden><div class="in" id="barin"></div></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
  <div class="card">
    <h2 id="sh-t">Apply these changes?</h2>
    <p class="lock">Signed in through Cloudflare Access as the owner. The agent can't press this.</p>
    <ul id="sh-l"></ul>
    <div class="acts" style="justify-content:flex-end"><button class="go ghost" id="cancel">Cancel</button><button class="go" id="confirm">Apply now</button></div>
  </div>
</div>
<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ms=t=>t==null?null:(t<1e11?t*1000:t);
const usd=n=>"$"+(n<0.1?Number(n).toFixed(3):Number(n).toFixed(2));
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
const ERR={
  "error.swarm.hash_mismatch":"The plan changed since this page loaded. Reload and look again.",
  "error.swarm.not_awaiting":"This swarm is no longer waiting for approval.",
  "error.swarm.expired":"This plan expired. Ask the agent to plan it again.",
  "error.swarm.busy":"Another swarm is running. Try again when it finishes.",
  "error.swarm.over_cap":"This would go over the spend cap.",
  "error.swarm.daily_cap":"The daily swarm budget is used up.",
  "error.swarm.not_found":"No swarm with this id.",
  "error.swarm.owner_only":"Only the owner can do this.",
  "error.swarm.not_ready":"Swarms are not set up yet (migration missing).",
  "error.swarm.off":"Swarms are switched off.",
  "error.swarm.bad_spec":"The plan is not valid.",
  "unauthorized":"Your sign-in expired. Reload the page.",
  "upstream":"The API did not answer. Try again in a moment.",
  "network":"Could not reach the server."
};
const errText=c=>ERR[c]||("Something went wrong ("+esc(c||"unknown")+").");
async function api(path,method,body){
  try{
    const r=await fetch(path,{method:method||"GET",credentials:"same-origin",headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
    let j=null;try{j=await r.json()}catch(e){}
    const c=j&&j.error?(typeof j.error==="string"?j.error:j.error.code):null;
    return{ok:r.ok,status:r.status,body:j,code:r.ok?null:(c||"upstream")};
  }catch(e){return{ok:false,status:0,body:null,code:"network"}}
}
const norm=b=>b&&typeof b.swarm==="object"&&b.swarm?b.swarm:b;
const path=location.pathname.split("/").filter(Boolean);
const id=path[1]||null;
const S={sw:null,changes:[],loaded:false,results:null,bq:{},pending:new Map(),filt:"all",batch:null,q:"",key:"",saveErr:null,timer:null,poll:null,busy:false,cd:null};
const OPS_LABEL=o=>o;

/* ---------- list page ---------- */
async function showList(){
  document.title="Swarms";
  $("head").innerHTML=`<section class="card head"><div><h1>Swarms</h1><p class="sub">Haiku agent swarms, newest first.</p></div></section>`;
  const r=await api("/api/swarms");
  if(!r.ok){$("body").innerHTML=`<div class="note">${errText(r.code)}</div>`;return}
  const l=(r.body&&r.body.swarms)||[];
  $("body").innerHTML=l.length?`<section class="card list">${l.map(s=>`<a class="item" href="/swarms/${esc(s.swarm)}"><b>${esc(s.name)}</b><span class="st-pill ${esc(s.status)}">${esc(label(s.status))}</span><span>${esc(s.mode)} · ${plural(s.items,"item")} · ${usd(s.spent_usd||0)} of ${usd(s.cap_usd||0)}</span><span>${ago(s.created_at)}</span></a>`).join("")}</section>`:`<div class="card empty">No swarms yet. An agent plans one with swarm_plan, then it shows up here.</div>`;
}
const label=s=>({awaiting_approval:"needs approval",running:"running",stopping:"stopping",done:"done",failed:"failed",stopped:"stopped",declined:"declined",expired:"expired"}[s]||s);
function ago(t){t=ms(t);if(!t)return"";const d=(Date.now()-t)/1000;if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+" min ago";if(d<86400)return Math.floor(d/3600)+" h ago";return new Date(t).toLocaleDateString()}

/* ---------- swarm page ---------- */
const sw=()=>S.sw;
const isReview=()=>sw().mode==="propose"&&sw().changes&&sw().status==="done"&&sw().changes.total>0;
const cellsDone=s=>s.tasks.done+s.tasks.failed;
function headHtml(){
  const s=sw(),kept=S.changes.filter(c=>c.keep).length;
  const figs=[];
  if(isReview())figs.push(`<div class="fg"><b>${S.loaded?kept:s.changes.kept}</b><small>to apply</small></div>`);
  if(s.status==="awaiting_approval"||s.status==="declined"||s.status==="expired")figs.push(`<div class="fg"><b>${usd(s.estimate_usd.low)}-${usd(s.estimate_usd.high)}</b><small>estimate, cap ${usd(s.cap_usd)}</small></div>`);
  else{figs.push(`<div class="fg"><b>${usd(s.spent_usd||0)}</b><small>of ${usd(s.cap_usd)} cap</small></div>`);
  figs.push(`<div class="fg"><b>${cellsDone(s)}/${s.tasks.total}</b><small>batches done</small></div>`)}
  const title=isReview()?`${esc(s.name)}: ${s.changes.total} change${s.changes.total===1?"":"s"} to review`:esc(s.name);
  return `<section class="card head"><div><h1>${title}</h1><p class="sub"><span class="st-pill ${esc(s.status)}">${esc(label(s.status))}</span> ${esc(s.mode)} mode · ${plural(s.items,"item")} in ${plural(s.tasks.total,"batch")} of ${s.batch_size} · Haiku 5.5 · <a href="/swarms">all swarms</a></p></div><div class="figs">${figs.join("")}</div></section>`;
}
function cellsHtml(clickable){
  const s=sw(),cells=s.tasks.cells||[];
  if(!cells.length)return"";
  const dense=cells.length>40;
  const nf=cells.filter(c=>c.status==="failed").length;
  return `<div class="strip"><p>Batches${clickable&&!dense?" (tap one to filter)":""}${nf?`. ${nf} failed.`:"."}</p><div class="cells${dense?" dense":""}">${cells.map(c=>{
    const lbl=`Batch ${c.idx+1}, ${c.status}${c.error?": "+c.error:""}`;
    return dense||!clickable?`<span class="cell ${esc(c.status)}" title="${esc(lbl)}" role="img" aria-label="${esc(lbl)}">${c.idx+1}</span>`:`<button class="cell ${esc(c.status)}${S.batch===c.idx?" on":""}" data-b="${c.idx}" aria-label="${esc(lbl)}" aria-pressed="${S.batch===c.idx}">${c.idx+1}</button>`}).join("")}</div></div>`;
}
function failNote(){
  const f=(sw().tasks.cells||[]).filter(c=>c.status==="failed");
  if(!f.length)return"";
  return `<div class="note"><b>${plural(f.length,"batch")} failed.</b> No changes or results come from ${f.length===1?"it":"them"}. Ask the agent to run ${f.length===1?"it":"them"} again (swarm_retry).<ul>${f.slice(0,20).map(c=>`<li>Batch ${c.idx+1}: ${esc(c.error||"failed")}</li>`).join("")}${f.length>20?`<li>and ${f.length-20} more</li>`:""}</ul></div>`;
}
function tags(a){return a&&a.length?a.map(t=>`<span class="tag">${esc(t)}</span>`).join(""):"none"}
function scopeText(sc){const k=Object.keys(sc||{});return k.length?k.map(x=>`<span class="tag">${esc(x)}: ${esc((sc[x]||[]).join(", "))}</span>`).join(""):"none"}
function cdText(){const e=ms(sw().expires_at);if(!e)return"";const d=Math.round((e-Date.now())/1000);if(d<=0)return"expired";return d>=3600?Math.floor(d/3600)+" h "+Math.floor(d%3600/60)+" min":d>=60?Math.floor(d/60)+" min "+(d%60)+" s":d+" s"}

const jstr=v=>{try{const t=JSON.stringify(v);return t===undefined?String(v):t}catch(e){return String(v)}};
const trunc=(t,n)=>t.length>n?t.slice(0,n-1)+"…":t;
function viewAwaiting(){
  const s=sw(),p=s.spec_preview||null;
  const uns=(s.unscoped_writes||[]);
  const extra=[];
  if(p){
    if(Array.isArray(p.items_sample))extra.push(`<dt>Item sample</dt><dd><div class="chips2">${p.items_sample.map(x=>`<span title="${esc(jstr(x))}">${esc(trunc(jstr(x),120))}</span>`).join("")}</div><small class="sub">first ${p.items_sample.length} of ${s.items}</small></dd>`);
    if(p.source)extra.push(`<dt>Source</dt><dd><span class="tag">${esc(p.source.call)}</span> <span class="chips2"><span>${esc(jstr(p.source.args))}</span>${p.source.path?`<span>path: ${esc(p.source.path)}</span>`:""}</span></dd>`);
    if(p.output_schema!=null)extra.push(`<dt>Output schema</dt><dd><details class="sch"><summary>Show schema</summary><pre>${esc(JSON.stringify(p.output_schema,null,2))}</pre></details></dd>`);
    if(p.reduce_prompt)extra.push(`<dt>Reduce prompt</dt><dd><pre class="prompt" style="margin:0">${esc(p.reduce_prompt)}</pre></dd>`);
    const lim=[];
    if(p.turns_per_task!=null)lim.push(plural(p.turns_per_task,"turn")+" per task");
    if(p.attempts!=null)lim.push(plural(p.attempts,"attempt")+" per task");
    if(p.stop_after_failed_tasks!=null)lim.push("stops after "+plural(p.stop_after_failed_tasks,"failed task"));
    if(lim.length)extra.push(`<dt>Limits</dt><dd>${esc(lim.join(" · "))}</dd>`);
  }
  const unsHtml=uns.length?`<div class="note" style="margin-top:14px">${uns.map(o=>`<div class="unscoped"><span class="tag">${esc(o)}</span> unscoped: can touch anything this op reaches</div>`).join("")}</div>`:"";
  const act=s.mode==="act"?`This swarm can <b>change things as it runs</b> (${esc(s.writes.join(", ")||"no writes")}), only inside the scope below.`:s.mode==="propose"?"Nothing changes now. The swarm only proposes changes; you review and apply them afterwards.":"The swarm only reads and reports.";
  return `<section class="card pad"><h2>Approve this swarm?</h2><p class="sub" style="margin-bottom:14px">${act}</p>
  <dl class="spec">
   <dt>Name</dt><dd>${esc(s.name)}</dd>
   <dt>Mode</dt><dd>${esc(s.mode)}</dd>
   <dt>Items</dt><dd>${s.items} in ${plural(s.tasks.total,"task")} (batches of ${s.batch_size})</dd>
   <dt>Read tools</dt><dd>${tags(s.tools)}</dd>
   <dt>Writes</dt><dd>${tags(s.writes)}</dd>
   <dt>Scope</dt><dd>${scopeText(s.scope)}</dd>
   ${s.spec_preview&&s.spec_preview.prefetch?`<dt>Prefetch</dt><dd>Looks up each item with ${esc(s.spec_preview.prefetch.call)} first (no model, no cost)</dd>`:""}
   ${extra.join("")}
   <dt>Concurrency</dt><dd>${s.concurrency} at a time</dd>
   <dt>Estimate</dt><dd>${usd(s.estimate_usd.low)} to ${usd(s.estimate_usd.high)}, hard cap ${usd(s.cap_usd)}</dd>
   <dt>Expires in</dt><dd><span id="cd">${esc(cdText()||"no expiry")}</span></dd>
  </dl>

  <div class="acts"><button class="go" id="approve">Approve and run</button><button class="go ghost" id="decline">Decline</button></div>
  <p class="lock" id="amsg" role="status" style="margin-top:12px"></p></section>`;
}
function viewRunning(){

}
function viewMessage(){

  return `<section class="card pad"><h2>${esc(label(s.status))}</h2><p style="margin:0">${m||""}</p>${s.error?`<p class="warn" style="font-size:14px;margin-top:10px">${esc(s.error)}</p>`:""}</section>`;
}
function viewSummary(){
  const s=sw();
  return `<section class="card">${cellsHtml(false)}${s.reduce?`<div class="pad" style="padding-top:0"><h2>Summary</h2><p class="reduce">${esc(s.reduce)}</p></div>`:""}</section>${failNote()}`;
}
// the results board (APP-API-CONTRACT.md section 62.4): the agents by score, search, groups, a card per row
const pct=v=>typeof v==="number"?Math.round(v*100)+"%":"–";
const tone=v=>typeof v!=="number"?"":v>=.75?"good":v>=.4?"mid":"low";
function viewResults(){
  const r=S.results;
  if(!r)return `<div class="card pad">Loading results…</div>`;
  const q=S.bq;
  const strip=r.agents.map(a=>{const o=a.outcome||{};const t=`Agent ${a.agent}: ${a.status}, score ${pct(o.score)}, ${o.answered} of ${o.items} answered${a.error?", "+a.error:""}`;return `<button class="ba ${a.status==="failed"?"bad":tone(o.score)}" data-ba="${a.agent}" aria-pressed="${q.agent===a.agent}" title="${esc(t)}" aria-label="${esc(t)}"></button>`}).join("");
  const sorts=[["agent","By agent"],["score","Best first"],["title","A to Z"]].map(([v,t])=>`<button class="chip" data-bs="${v}" aria-pressed="${(q.sort||"agent")===v}">${t}</button>`).join("");
  const groups=r.groups.length?`<button class="chip" data-bg="" aria-pressed="${q.group===undefined}">All</button>`+r.groups.map(g=>`<button class="chip" data-bg="${esc(g.value)}" aria-pressed="${q.group===g.value}">${esc(g.value)}<i>${g.count}</i></button>`).join(""):"";
  const card=x=>{const pics=(x.media||[]).filter(m=>m.preview_url&&/^https:\/\//.test(m.preview_url)).slice(0,4);const f=Object.entries(x.fields||{});
    return `<div class="bc"><div class="pics">${pics.length?pics.map(m=>`<img src="${esc(m.preview_url)}" alt="${esc(m.title||m.ref)}" loading="lazy">`).join(""):`<span class="sub">no picture</span>`}</div><b>${esc(x.title)}</b>${typeof x.score==="number"?`<span class="sc ${tone(x.score)}">${pct(x.score)}</span> `:""}<small>Agent ${x.agent}${x.group?" · "+esc(x.group):""}</small>${f.slice(0,3).map(([k,v])=>`<small>${esc(k)}: ${esc(String(v))}</small>`).join("")}${f.length>3||x.links.length||pics.length?`<details><summary>All of it</summary>${f.map(([k,v])=>`<small>${esc(k)}: ${esc(String(v))}</small>`).join("")}${(x.media||[]).map(m=>m.open_url?`<small><a href="${esc(m.open_url)}" target="_blank" rel="noopener">${esc(m.ref)}</a></small>`:"").join("")}${x.links.map(l=>`<small><a href="${esc(l)}" target="_blank" rel="noopener">${esc(l)}</a></small>`).join("")}</details>`:""}</div>`};
  return `<section class="card rows"><div class="grp"><span>Results${typeof r.score==="number"?` · score ${pct(r.score)}`:""}</span><span>${r.total} total</span></div><div class="bst">${strip}</div>
  <div class="btools"><div class="tools"><input type="search" id="bq" placeholder="Search results" aria-label="Search results" value="${esc(q.q||"")}">${sorts}</div>${groups?`<div class="tools" style="margin-top:0">${groups}</div>`:""}</div>
  ${r.list.length?`<div class="bgrid">${r.list.map(card).join("")}</div>`:`<div class="empty">Nothing matches.</div>`}</section>${r.list.length<r.total?`<button class="go ghost more" id="moreres">Load more</button>`:""}`;
}
function viewReview(){
  const s=sw();
  const ops=[...new Set(S.changes.map(c=>c.op))];
  return `<section class="card">${cellsHtml(true)}</section>${failNote()}
  <div class="tools"><input type="search" id="q" placeholder="Search changes" aria-label="Search changes" value="${esc(S.q)}">
  <div id="chips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  ${(s.tasks.cells||[]).length>40?`<select id="bsel" aria-label="Batch" class="chip"><option value="">All batches</option>${s.tasks.cells.map(c=>`<option value="${c.idx}"${S.batch===c.idx?" selected":""}>Batch ${c.idx+1}</option>`).join("")}</select>`:""}
  <div class="bulk"><button class="lnk" id="all">Tick all</button><button class="lnk" id="none">Untick shown</button></div></div>
  <p class="hint">Names and targets are as described by the swarm. The line under each row is what plain code will send.</p>
  <section class="card rows" id="rows"></section>`;
}
function chipsHtml(){
  const ops=[...new Set(S.changes.map(c=>c.op))];
  return [["all","All",S.changes.length]].concat(ops.map(o=>[o,OPS_LABEL(o),S.changes.filter(c=>c.op===o).length])).map(([k,l,n])=>`<button class="chip" data-k="${esc(k)}" aria-pressed="${S.filt===k}">${esc(l)}<i>${n}</i></button>`).join("");
}
const locked=()=>sw().apply.status==="applying"||sw().apply.status==="applied";
const shown=()=>{const q=S.q;return S.changes.filter(c=>(S.filt==="all"||c.op===S.filt)&&(S.batch==null||c.task===S.batch)&&(!q||((c.before||"")+" "+(c.after||"")+" "+(c.target||"")+" "+c.op).toLowerCase().includes(q)))};
function rowHtml(c){
  const lock=locked();
  const name=c.before||c.target||c.op;
  const pic=c.preview_url&&/^https:\/\//.test(c.preview_url)?`<img class="emo" src="${esc(c.preview_url)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:`<div class="emo" aria-hidden="true">${esc((name||"?").trim().charAt(0).toUpperCase())}</div>`;
  let right;
  const cl=c.keep?c.clash:null;
  if(c.edit_arg)right=`<span class="arr">→</span><span class="box"><input type="text" data-n="${c.n}" aria-label="New value for ${esc(name)}" value="${esc(c.after||"")}" class="${cl?"bad":""}" ${lock||c.status!=="proposed"?"disabled":""}><span class="warn" data-w="${c.n}">${esc(cl||"")}</span></span>`;
  else right=`<span class="arr">→</span><span class="box"><span class="set">${esc(c.after||c.op)}</span><span class="warn" data-w="${c.n}">${esc(cl||"")}</span></span>`;
  const st=c.status!=="proposed"?`<span class="stt ${c.status==="done"?"ok":c.status==="failed"?"err":"run"}">${esc(c.status==="failed"?"failed":c.status)}${c.error?`<br><span style="font-weight:400;color:var(--cap)">${esc(c.error)}</span>`:""}</span>`:`<span class="why">batch ${c.task+1}</span>`;
  return `<div class="row${c.keep?"":" off"}" data-r="${c.n}"><label class="tick"><input type="checkbox" data-c="${c.n}" ${c.keep?"checked":""} ${lock?"disabled":""} aria-label="Keep change to ${esc(name)}"></label>${pic}<div class="old">${esc(c.before||c.target||c.op)}<small>${esc(c.target&&c.before?c.target+" · ":"")}${esc(c.op)}</small></div><div class="new">${right}</div>${st}${argsLine(c)}</div>`;
}
function argsLine(c){
  const a=c.args&&typeof c.args==="object"?c.args:{};
  const ks=Object.keys(a).filter(k=>k!==c.edit_arg);
  if(!ks.length)return"";
  return `<div class="args">${ks.map(k=>{const f=jstr(a[k]);return `<span title="${esc(k+": "+f)}">${esc(k)}: ${esc(trunc(f,80))}</span>`}).join("")}</div>`;
}
const RENDER_CAP=400;
function drawRows(){
  const el=$("rows");if(!el)return;
  const s=shown();let h="";
  const ops=[...new Set(s.map(c=>c.op))];
  let n=0;
  for(const o of ops){
    const g=s.filter(c=>c.op===o);
    h+=`<div class="grp"><span>${esc(OPS_LABEL(o))}</span><span>${g.filter(c=>c.keep).length} of ${g.length} kept</span></div>`;
    for(const c of g){if(n++>=S.limit)break;h+=rowHtml(c)}
  }
  if(n>S.limit)h+=`<div class="empty"><button class="go ghost" id="showmore">Show more (${s.length-S.limit} left)</button></div>`;
  el.innerHTML=h||`<div class="empty">No changes match. Clear the search or pick another batch.</div>`;
  if($("chips"))$("chips").innerHTML=chipsHtml();
  drawHead();drawBar();
}
function drawHead(){$("head").innerHTML=headHtml()}

/* ---------- bar ---------- */
function applyState(){
  const s=sw(),kept=S.changes.filter(c=>c.keep),bad=kept.filter(c=>c.clash);
  return{kept,bad};
}
function drawBar(){
  const s=sw(),bar=$("bar"),inn=$("barin");
  let h="";
  if(s.status==="running"||s.status==="stopping"){
    h=`<p><b>${s.status==="stopping"?"Stopping":"Running"}</b> · ${usd(s.spent_usd||0)} of ${usd(s.cap_usd)}</p><button class="go danger" id="stop" ${s.status==="stopping"?"disabled":""}>${s.status==="stopping"?"Stopping…":"Stop"}</button>`;
  }else if(isReview()){
    const a=s.apply;
    if(a.status==="applying"){const p=a.total?a.done/a.total*100:0;h=`<p><b>Applying ${a.done+a.failed} of ${a.total}</b>${a.failed?`, ${a.failed} refused`:""}</p><div class="meter" role="progressbar" aria-label="Applying" aria-valuenow="${Math.round(p)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`}
    else if(a.status==="applied"||(a.status==="failed")){h=`<p><b>${a.done} applied</b>${a.failed?`, ${a.failed} failed (see the rows)`:""}. ${a.status==="applied"?"The swarm is done.":""}</p>${a.status==="failed"?`<button class="go" id="apply">Apply again</button>`:""}`}
    else{
      const {kept,bad}=applyState();
      const n=o=>kept.filter(c=>c.op===o).length;
      const ops=[...new Set(kept.map(c=>c.op))];
      h=`<p>${bad.length?`<b>${(bad.length+" clash"+(bad.length===1?"":"es"))}</b> to fix or untick before applying.`:`<b>${kept.length} of ${S.changes.length} kept</b>${ops.length?": "+ops.map(o=>n(o)+" "+esc(o)).join(", "):""}`}${S.saveErr?` <span class="warn" style="display:inline">${errText(S.saveErr)}</span>`:S.pending.size?" Saving…":""}</p><button class="go" id="apply" ${!kept.length||bad.length?"disabled":""}>Apply ${kept.length} change${kept.length===1?"":"s"}</button>`;
    }
  }
  bar.hidden=!h;document.body.classList.toggle("hasbar",!!h);inn.innerHTML=h;
}

/* ---------- data ---------- */
async function loadChanges(){
  const all=[];let off=0,total=Infinity;
  while(off<total){
    const r=await api(`/api/swarms/${id}/changes?offset=${off}&limit=200`);
    if(!r.ok)return r;
    const l=r.body.changes||[];total=r.body.total??l.length;all.push(...l);off+=l.length;if(!l.length)break;
  }
  // merge: keep local edits that are still waiting to be saved
  S.changes=all.map(c=>{const p=S.pending.get(c.n);if(!p)return c;const o={...c};if(p.keep!==undefined)o.keep=p.keep;if(p.after!==undefined)o.after=p.after;return o});
  S.loaded=true;return{ok:true};
}
async function loadResults(more){
  const off=more&&S.results?S.results.list.length:0;
  const p=new URLSearchParams({offset:String(off),limit:"100"});
  for(const [k,v] of Object.entries(S.bq))if(v!==undefined&&v!=="")p.set(k,String(v));
  const r=await api(`/api/swarms/${id}/board?${p}`);
  if(!r.ok)return;
  const b=r.body,l=b.rows||[];
  S.results={list:(more&&S.results?S.results.list:[]).concat(l),total:b.total??l.length,agents:b.agents||[],groups:b.groups||[],score:b.swarm&&b.swarm.score};
}
async function boardBy(patch){Object.assign(S.bq,patch);await loadResults(false);$("body").innerHTML=bodyFor()}
function queue(n,patch){
  const p=S.pending.get(n)||{n};Object.assign(p,patch);S.pending.set(n,p);S.saveErr=null;
  clearTimeout(S.timer);S.timer=setTimeout(flush,600);drawBar();
}
let chain=Promise.resolve(true);
const flush=()=>(chain=chain.then(doFlush));
async function doFlush(){
  clearTimeout(S.timer);
  if(!S.pending.size)return true;
  const batch=[...S.pending.values()].slice(0,90);
  const sent=new Map(batch.map(p=>[p.n,JSON.stringify(p)]));
  const r=await api(`/api/swarms/${id}/changes`,"POST",{changes:batch});
  if(!r.ok){S.saveErr=r.code;drawBar();return false}
  S.saveErr=null;
  for(const p of batch){const cur=S.pending.get(p.n);if(cur&&JSON.stringify(cur)===sent.get(p.n))S.pending.delete(p.n)}
  if(S.pending.size)return doFlush();
  await refreshClashes();
  return true;
}
async function refreshClashes(){
  const r=await loadChanges();if(!r.ok)return;
  const active=document.activeElement;
  if(active&&active.dataset&&active.dataset.n!==undefined){ // typing: update only the warnings in place
    for(const c of S.changes){const w=document.querySelector(`[data-w="${c.n}"]`);if(w)w.textContent=c.keep&&c.clash?c.clash:"";const i=document.querySelector(`input[data-n="${c.n}"]`);if(i)i.classList.toggle("bad",!!(c.keep&&c.clash))}
    drawHead();drawBar();
  }else drawRows();
}

/* ---------- render ---------- */
function bodyFor(){
  const s=sw();
  switch(s.status){
    case"awaiting_approval":return viewAwaiting();
    case"running":case"stopping":return viewRunning();
    case"done":return s.mode==="propose"&&s.changes&&s.changes.total>0?viewReview():viewSummary()+viewResults();
    case"failed":case"stopped":return viewMessage()+viewSummary()+(S.results&&S.results.agents.length?viewResults():"");
    default:return viewMessage();
  }
}
function renderAll(){
  const s=sw();document.title=s.name+" · Swarm";
  drawHead();$("body").innerHTML=bodyFor();
  if(isReview()){drawRows()}
  drawBar();
  clearInterval(S.cd);if(s.status==="awaiting_approval")S.cd=setInterval(()=>{const e=$("cd");if(e){const t=cdText();e.textContent=t||"no expiry";if(t==="expired"){clearInterval(S.cd);refresh()}}},1000);
}
async function refresh(){
  const r=await api("/api/swarms/"+id);
  if(!r.ok){if(!S.sw)$("body").innerHTML=`<div class="note">${errText(r.code)}</div>`;schedule(true);return}
  const prev=S.sw;S.sw=norm(r.body);const s=S.sw;
  const key=[s.status,s.mode,s.apply&&s.apply.status,s.changes&&s.changes.total>0].join("|");
  const needsResults=(s.status==="done"&&!isReview())||s.status==="failed"||s.status==="stopped";
  if(isReview()&&(!S.loaded||s.apply.status==="applying"||(prev&&prev.apply.status==="applying"&&s.apply.status!=="applying"))){const e=await loadChanges();if(!e.ok){$("body").innerHTML=`<div class="note">${errText(e.code)}</div>`;return}}
  if(needsResults&&(!S.results||key!==S.key))await loadResults(false);
  if(key!==S.key||s.status==="running"||s.status==="stopping"){S.key=key;S.limit=RENDER_CAP;renderAll()}
  else if(isReview()){drawRows()}
  else{drawHead();drawBar()}
  schedule();
}
function schedule(retry){
  clearTimeout(S.poll);
  const s=S.sw;
  if(retry||(s&&(s.status==="running"||s.status==="stopping"||(s.apply&&s.apply.status==="applying"))))S.poll=setTimeout(refresh,3000);
}

/* ---------- actions ---------- */
async function act(name,body,msgEl){
  if(S.busy)return;S.busy=true;
  document.querySelectorAll("button.go").forEach(b=>b.disabled=true);
  const r=await api(`/api/swarms/${id}/${name}`,"POST",body);
  S.busy=false;
  if(!r.ok){const m=errText(r.code);if(msgEl&&$(msgEl))$(msgEl).textContent=m;else{S.saveErr=r.code}document.querySelectorAll("button.go").forEach(b=>b.disabled=false);drawBar();if(r.code==="error.swarm.hash_mismatch"||r.code==="error.swarm.expired"||r.code==="error.swarm.not_awaiting")refresh();return}
  S.key="";await refresh();
}
function openSheet(){
  const kept=S.changes.filter(c=>c.keep);
  const ops=[...new Set(kept.map(c=>c.op))];
  $("sh-l").innerHTML=ops.map(o=>`<li>${kept.filter(c=>c.op===o).length} × ${esc(o)}</li>`).join("")+`${kept.some(c=>c.op.indexOf("seventv.")===0)?"<li>7TV writes are paced at 1 a second, about "+Math.max(1,Math.ceil(kept.filter(c=>c.op.indexOf("seventv.")===0).length/60))+" min</li>":""}<li>No AI involved: plain code applies exactly this list</li><li>${S.changes.length-kept.length} unticked changes are dropped</li>`;
  $("sh-t").textContent=`Apply ${kept.length} change${kept.length===1?"":"s"}?`;
  $("sheet").classList.add("show");$("confirm").focus();
}
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,input[type=checkbox]");if(!t)return;
  if(t.dataset.b!==undefined){const b=+t.dataset.b;S.batch=S.batch===b?null:b;$("body").innerHTML=bodyFor();S.limit=RENDER_CAP;drawRows()}
  else if(t.dataset.k){S.filt=t.dataset.k;S.limit=RENDER_CAP;drawRows()}
  else if(t.dataset.c!==undefined){const c=S.changes.find(x=>x.n===+t.dataset.c);c.keep=t.checked;queue(c.n,{keep:c.keep});drawRows()}
  else if(t.id==="all"){const l=S.changes.filter(c=>!c.keep);l.forEach(c=>{c.keep=true;queue(c.n,{keep:true})});drawRows()}
  else if(t.id==="none"){shown().forEach(c=>{if(c.keep){c.keep=false;queue(c.n,{keep:false})}});drawRows()}
  else if(t.id==="showmore"){S.limit+=RENDER_CAP;drawRows()}
  else if(t.id==="moreres"){await loadResults(true);$("body").innerHTML=bodyFor()}
  else if(t.dataset.ba){const a=+t.dataset.ba;await boardBy({agent:S.bq.agent===a?undefined:a})}
  else if(t.dataset.bs){await boardBy({sort:t.dataset.bs})}
  else if(t.dataset.bg!==undefined){await boardBy({group:t.dataset.bg===""?undefined:t.dataset.bg})}
  else if(t.id==="approve")act("approve",{spec_hash:sw().spec_hash},"amsg");
  else if(t.id==="decline")act("decline",undefined,"amsg");
  else if(t.id==="stop")act("stop");
  else if(t.id==="apply"){if(sw().apply.status==="failed"){act("apply",{spec_hash:sw().spec_hash});return}
    t.disabled=true;const ok=await flush();if(!ok){drawBar();return}
    const {bad}=applyState();drawRows();if(bad.length)return;openSheet()}
  else if(t.id==="cancel")$("sheet").classList.remove("show");
  else if(t.id==="confirm"){$("sheet").classList.remove("show");act("apply",{spec_hash:sw().spec_hash})}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){S.q=t.value.toLowerCase().trim();S.limit=RENDER_CAP;drawRows();const q=$("q");return}
  if(t.dataset&&t.dataset.n!==undefined){const c=S.changes.find(x=>x.n===+t.dataset.n);c.after=t.value;queue(c.n,{after:t.value})}
});
document.addEventListener("change",e=>{if(e.target.id==="bsel"){S.batch=e.target.value===""?null:+e.target.value;drawRows()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("sheet").classList.remove("show");if(e.key==="Enter"&&e.target.id==="bq")boardBy({q:e.target.value.trim()||undefined})});
document.addEventListener("error",e=>{ // a picture that does not load: neutral tile with the first letter
  const t=e.target;if(t&&t.tagName==="IMG"&&t.classList.contains("emo")){const d=document.createElement("div");d.className="emo";d.setAttribute("aria-hidden","true");const row=t.closest("[data-r]");const c=row&&S.changes.find(x=>x.n===+row.dataset.r);d.textContent=((c&&(c.before||c.target||c.op))||"?").trim().charAt(0).toUpperCase();t.replaceWith(d)}
},true);
window.addEventListener("beforeunload",e=>{if(S.pending.size){e.preventDefault();e.returnValue=""}});

if(id)refresh();else showList();
}
</script>
</body>
</html>
